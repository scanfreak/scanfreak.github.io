<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
}

    a-scene {
        position: fixed !important;
        top: 0;
        left: 0;
        width: 100vw !important;
        height: 100vh !important;
}
    a-scene canvas {
        background: transparent !important;
}

    #overlay {
        position: absolute;
        bottom: 20px;              /* Bottom of screen */
        left: 0; right: 0;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
        text-shadow: 2px 2px 4px black; /* Makes text pop */
        text-align: center;
        font-family: Arial, sans-serif;
        background: rgba(0, 0, 0, 0.4);   /* text background */
        border-radius: 15px 15px 15px 15px;     /* Rounded corners */
        pointer-events: none;             /* Doesn't block camera */
        z-index: 10;
        transition: opacity 0.5s;         /* Smooth fade when hiding */
    }
    #overlay.hidden {
        opacity: 0;
    }
    </style>
</head>
<body>
    <div id="overlay">Point camera at the SCANFREAK design!</div>

    <a-scene 
        mindar-image="imageTargetSrc: descriptors/collection01/wisewizard/wisewizard.mind; descriptors/collection01/nostradamus/nostradamus.mind; filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 5; missTolerance: 10;" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
        embedded>

        <a-assets timeout="10000">
            <video id="wiz1" src="videos/collection01/wisewizard/wisewizard01.mp4" crossorigin="anonymous"></video>
            <video id="wiz2" src="videos/collection01/wisewizard/wisewizard02.mp4" crossorigin="anonymous"></video>
            <video id="wiz3" src="videos/collection01/wisewizard/wisewizard03.mp4" crossorigin="anonymous"></video>
            <video id="nos1" src="videos/collection01/nostradamus/nostradamus01.mp4" crossorigin="anonymous"></video>
            <video id="nos2" src="videos/collection01/nostradamus/nostradamus02.mp4" crossorigin="anonymous"></video>
            <video id="nos3" src="videos/collection01/nostradamus/nostradamus03.mp4" crossorigin="anonymous"></video>



            <!-- Add more <video> lines here for additional videos (vid4, etc.) -->
        </a-assets>

        <a-entity mindar-image-target="targetIndex: 0" id="wisewizardTarget" lock-rotation>
            <a-plane
                id="wisewizardPlane"
                width="1"
                  
                position="0 0 0.05"
                material="shader: flat; side: double"
                animation="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 500; startEvents: targetFound"
                animation__hide="property: scale; to: 0.1 0.1 0.1; dur: 500; startEvents: targetLost">
            </a-plane>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 0" id="nostradamusTarget" lock-rotation>
            <a-plane
                id="nostradamusPlane"
                width="1"
                  
                position="0 0 0.05"
                material="shader: flat; side: double"
                animation="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 500; startEvents: targetFound"
                animation__hide="property: scale; to: 0.1 0.1 0.1; dur: 500; startEvents: targetLost">
            </a-plane>
        </a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
    const overlay = document.getElementById('overlay');

    // Setup helper function to handle random video assignment and playback
    const setupTarget = (targetId, planeId, videoIds) => {
        const target = document.getElementById(targetId);
        const plane = document.getElementById(planeId);
        
        // Pick a random video from the provided list
        const randomVidId = videoIds[Math.floor(Math.random() * videoIds.length)];
        const videoEl = document.querySelector(randomVidId);
        
        // Assign video to plane
        plane.setAttribute('src', randomVidId);

        // Resize plane logic
        const resize = () => {
            const ratio = videoEl.videoHeight / videoEl.videoWidth;
            if (ratio) plane.setAttribute('height', ratio);
        };

        if (videoEl.readyState >= 1) resize();
        else videoEl.addEventListener('loadedmetadata', resize);

        // Events
        target.addEventListener('targetFound', () => {
            overlay.classList.add('hidden');
            videoEl.play();
        });

        target.addEventListener('targetLost', () => {
            overlay.classList.remove('hidden');
            videoEl.pause();
        });
    };

    // Initialize both characters
    setupTarget('wizardTarget', 'wizardPlane', ['#wiz1', '#wiz2', '#wiz3']);
    setupTarget('nostradamusTarget', 'nostradamusPlane', ['#nos1', '#nos2', '#nos3']);
</script>
