<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; transition: opacity 0.5s;
        }

        #loading-container {
            width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1);
            margin-top: 20px; border-radius: 10px; position: relative;
            overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #loading-bar {
            width: 40%; height: 100%; background: #ffffff;
            position: absolute; left: -40%; border-radius: 10px;
            animation: loadingMove 1.5s infinite ease-in-out; box-shadow: 0 0 10px #fff;
        }

        @keyframes loadingMove { 0% { left: -40%; } 50% { left: 100%; } 100% { left: -40%; } }

        .logo-wrapper {
            position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            width: 70vw; height: 70vw; max-width: 300px; max-height: 300px;
            margin-bottom: 20px;
        }

        .logo-image { max-width: 90%; max-height: 90%; object-fit: contain; display: block; opacity: 1; }
        .animate-logo { animation: fadeOut 3s ease-in-out forwards; }
        .logo-wrapper::after {
            content: ""; position: absolute; top: -150%; left: -150%; width: 100%; height: 400%;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.7), transparent);
            transform: rotate(25deg);
        }

        .animate-sweep::after { animation: sweep 1.2s ease-in-out forwards; }
        @keyframes sweep { 100% { top: 100%; left: 100%; } }
        @keyframes fadeOut { 0%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }

        #start-btn {
            font-family: 'Press Start 2P', cursive; padding: 15px 15px; font-size: 15px; color: black;
            background: white; border: 4px solid #555; border-radius: 15px; cursor: pointer;
            text-transform: uppercase; box-shadow: 4px 4px 0px #888; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease-in; position: absolute;
        }

        #start-btn.visible { opacity: 1; pointer-events: auto; animation: pulseBtn 1.5s infinite; }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.08); box-shadow: 0 0 15px rgba(255,255,255,0.4); } 100% { transform: scale(1); } }
        #start-btn:active { transform: translate(4px, 4px); box-shadow: none; }
        #start-screen.hidden { opacity: 0; pointer-events: none; }

        #overlay { position: absolute; bottom: 20px; left: 0; right: 0; padding: 20px; text-align: center; color: white; font-size: 24px; font-family: Arial, sans-serif; text-shadow: 2px 2px 4px black; background: rgba(0, 0, 0, 0.4); border-radius: 15px; z-index: 10; transition: opacity 0.5s; pointer-events: none; opacity: 0; }
        #overlay.visible { opacity: 1; }

        /* UNIFIED UI BUTTONS (Help & CTA) */
        .btn-ui {
            position: absolute; right: 20px; width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.4); color: white; border: 2px solid white;
            border-radius: 12px; /* Rounded Corners */
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 20; transition: opacity 0.5s;
            opacity: 0; pointer-events: none; text-decoration: none;
        }
        .btn-ui.visible { opacity: 1; pointer-events: auto; }
        
        #help-btn { top: 20px; font-family: 'Press Start 2P', cursive; font-size: 15px; }
        #cta-btn { top: 75px; font-size: 20px; } /* Stacked below Help */

        #help-message { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 400px; padding: 25px; text-align: center; color: white; 
            font-size: 18px; font-family: Arial, sans-serif; background: rgba(0, 0, 0, 0.85); 
            border-radius: 15px; border: 1px solid #555; z-index: 25; transition: opacity 0.5s; 
            opacity: 0; pointer-events: none; cursor: pointer;
        }
        #help-message.visible { opacity: 1; pointer-events: auto; }

        #error-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(139, 0, 0, 0.95); color: white;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; text-align: center; padding: 20px; font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div id="error-screen">
        <h2 style="font-family: 'Press Start 2P', cursive; font-size: 18px;">CAMERA BLOCKED</h2>
        <p>Please click the camera/lock icon in your browser's address bar to allow access, then refresh the page.</p>
        <button onclick="location.reload()" style="padding:10px; cursor:pointer;">RELOAD PAGE</button>
    </div>

    <div id="start-screen">
        <div class="logo-wrapper" id="logo-container">
            <img src="assets/scanfreakblanklogo.png" class="logo-image" id="main-logo" alt="SCANFREAK AR">
        </div>
        <div id="loading-container"><div id="loading-bar"></div></div>
        <button id="start-btn">PRESS START</button>
    </div>

    <div id="help-btn" class="btn-ui">?</div>
    <a id="cta-btn" class="btn-ui" href="https://your-shopify-link-here.com" target="_blank">🛒</a>

    <div id="help-message">Scanner not loading? Pause your VPN, Adblocker or use link above in a default browser like Chrome or Safari.</div>
    <div id="overlay">Point camera at the SCANFREAK design!</div>

    <a-scene id="ar-scene"
        mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; filterMinCF: 0.001; filterBeta: 1000;" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

        <a-assets></a-assets>

        <a-entity mindar-image-target="targetIndex: 0"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 1"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 2"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 3"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 4"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 5"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 6"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 7"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 8"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 9"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 10"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 11"><a-plane visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
    const COLLECTION_DATA = {
        0: { name: 'wizard', prefix: 'wiz', count: 20, folder: 'wizard' },
        1: { name: 'witch3', prefix: 'wit3', count: 6, folder: 'witch3' },
        2: { name: 'witch2', prefix: 'wit2', count: 6, folder: 'witch2' },
        3: { name: 'witch1', prefix: 'wit1', count: 6, folder: 'witch1' },
        4: { name: 'tealeaf', prefix: 'tea', count: 20, folder: 'tealeaf' },
        5: { name: 'tarot', prefix: 'tar', count: 78, folder: 'tarot' },
        6: { name: 'seer', prefix: 'see', count: 20, folder: 'seer' },
        7: { name: 'portal', prefix: 'por', count: 20, folder: 'portal' },
        8: { name: 'nostradamus', prefix: 'nos', count: 20, folder: 'nostradamus' },
        9: { name: 'mystic', prefix: 'mys', count: 20, folder: 'mystic' },
        10: { name: 'mermaid', prefix: 'mer', count: 20, folder: 'mermaid' },
        11: { name: 'fortune', prefix: 'for', count: 20, folder: 'fortune' }
    };

    const sceneEl = document.querySelector('a-scene');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const loadingContainer = document.getElementById('loading-container');
    const logoContainer = document.getElementById('logo-container');
    const mainLogo = document.getElementById('main-logo');
    const overlay = document.getElementById('overlay');
    const helpBtn = document.getElementById('help-btn');
    const ctaBtn = document.getElementById('cta-btn');
    const helpMessage = document.getElementById('help-message');
    const errorScreen = document.getElementById('error-screen');

    let isStarted = false; 
    let helpTimer;
    const videoPool = {}; 

    const hideHelp = () => {
        helpMessage.classList.remove('visible');
        clearTimeout(helpTimer);
    };

    sceneEl.addEventListener("arError", (event) => {
        loadingContainer.style.display = 'none';
        startScreen.style.display = 'none';
        errorScreen.style.display = 'flex';
    });

    sceneEl.addEventListener("arReady", () => {
        loadingContainer.style.display = 'none'; 
        logoContainer.classList.add('animate-sweep');
        mainLogo.classList.add('animate-logo');
        setTimeout(() => {
            logoContainer.style.display = 'none'; 
            startBtn.classList.add('visible');   
        }, 3000);
    });

    window.addEventListener('load', () => {
        Object.keys(COLLECTION_DATA).forEach(index => {
            setupTarget(index);
        });
    });

    startBtn.addEventListener('click', () => {
        startScreen.classList.add('hidden');
        overlay.classList.add('visible'); 
        helpBtn.classList.add('visible');
        ctaBtn.classList.add('visible');
        isStarted = true;
        Object.values(videoPool).forEach(v => v.load());
    });

    const setupTarget = (index) => {
        const data = COLLECTION_DATA[index];
        const target = document.querySelector(`[mindar-image-target="targetIndex: ${index}"]`);
        if (!target) return;

        const plane = target.querySelector('a-plane');
        let isTargetVisible = false;

        const video = document.createElement('video');
        video.crossOrigin = "anonymous";
        video.loop = false;
        video.preload = "auto";
        video.setAttribute('playsinline', ''); 
        video.setAttribute('webkit-playsinline', ''); 
        video.style.display = 'none';
        document.body.appendChild(video);
        
        videoPool[index] = video;

        video.addEventListener('loadeddata', () => {
            if (isTargetVisible) {
                const ratio = video.videoHeight / video.videoWidth;
                plane.setAttribute('height', ratio);
                plane.setAttribute('material', {src: video, shader: 'flat'});
                plane.setAttribute('visible', true);
                video.play().catch(e => console.log("Play error:", e));
            }
        });

        target.addEventListener('targetFound', () => {
            if (!isStarted) return; 
            isTargetVisible = true;
            overlay.classList.remove('visible'); 
            helpBtn.classList.remove('visible');
            ctaBtn.classList.remove('visible'); // HIDE CTA
            hideHelp(); 

            const rand = Math.floor(Math.random() * data.count) + 1;
            video.src = `videos/collection01/${data.folder}/${data.prefix}${rand}.mp4`;
            video.load(); 
        });

        target.addEventListener('targetLost', () => {
            isTargetVisible = false;
            plane.setAttribute('visible', false);
            if (isStarted) {
                overlay.classList.add('visible'); 
                helpBtn.classList.add('visible');
                ctaBtn.classList.add('visible'); // SHOW CTA
            }
            video.pause();
        });
    };

    helpBtn.addEventListener('click', () => {
        if (helpMessage.classList.contains('visible')) hideHelp();
        else {
            helpMessage.classList.add('visible');
            clearTimeout(helpTimer); 
            helpTimer = setTimeout(hideHelp, 12000);
        }
    });

    // Tap help message to close it
    helpMessage.addEventListener('click', hideHelp);
    </script>
</body>
</html>
