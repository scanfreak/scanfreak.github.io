<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: none; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; transition: opacity 0.5s, visibility 0.5s;
            user-select: none;
        }

        #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .logo-wrapper {
            position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            width: 70vw; height: 70vw; max-width: 300px; max-height: 300px;
            margin-bottom: 20px;
        }

        .logo-image { max-width: 90%; max-height: 90%; object-fit: contain; display: block; opacity: 1; }
        .animate-logo { animation: fadeOut 3s ease-in-out forwards; }
        
        .logo-wrapper::after {
            content: ""; position: absolute; top: -150%; left: -150%; width: 100%; height: 400%;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.7), transparent);
            transform: rotate(25deg);
        }

        .animate-sweep::after { animation: sweep 1.2s ease-in-out forwards; }
        @keyframes sweep { 100% { top: 100%; left: 100%; } }
        @keyframes fadeOut { 0%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }

        #loading-container {
            width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1);
            margin-top: 20px; border-radius: 10px; position: relative;
            overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #loading-bar {
            width: 40%; height: 100%; background: #ffffff;
            position: absolute; left: -40%; border-radius: 10px;
            animation: loadingMove 1.5s infinite ease-in-out; box-shadow: 0 0 10px #fff;
        }

        @keyframes loadingMove { 0% { left: -40%; } 50% { left: 100%; } 100% { left: -40%; } }

        #start-btn {
            font-family: 'Press Start 2P', cursive; padding: 15px 15px; font-size: 15px; color: black;
            background: white; border: 4px solid #555; border-radius: 15px; cursor: pointer;
            text-transform: uppercase; box-shadow: 4px 4px 0px #888; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease-in; 
            position: absolute; 
            margin-top: 30px; 
        }

        #start-btn.visible { opacity: 1; pointer-events: auto; animation: pulseBtn 1.5s infinite; }
        
        @keyframes pulseBtn { 
            0% { transform: translateY(-50%) scale(1); } 
            50% { transform: translateY(-50%) scale(1.08); box-shadow: 0 0 15px rgba(255,255,255,0.4); } 
            100% { transform: translateY(-50%) scale(1); } 
        }
        
        #start-btn:active { transform: translateY(-50%) translate(4px, 4px); box-shadow: none; }

        #overlay { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: max-content; max-width: 85%; padding: 12px 20px; text-align: center; 
            color: white; font-size: 18px; font-family: Arial, sans-serif; 
            text-shadow: 2px 2px 4px black; background: rgba(0, 0, 0, 0.6); 
            border-radius: 12px; z-index: 10; transition: opacity 0.5s; 
            pointer-events: none; opacity: 0; 
        }
        #overlay.visible { opacity: 1; }

        .btn-ui {
            position: absolute; width: 36px; height: 36px; right: 15px;
            background: rgba(0, 0, 0, 0.4); color: white; border: 2px solid white;
            border-radius: 10px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 20; transition: opacity 0.5s;
            opacity: 0; pointer-events: none; text-decoration: none; overflow: hidden;
        }
        .btn-ui.visible { opacity: 1; pointer-events: auto; }
        
        #help-btn { top: 15px; font-family: 'Press Start 2P', cursive; font-size: 12px; }
        #cta-btn { top: 60px; } 
        #share-btn { top: 105px; } 

        #screenshot-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 60px; border-radius: 15px; z-index: 20;
            display: none;
        }
        #screenshot-btn.visible { display: flex; opacity: 1; pointer-events: auto; }

        .ui-icon { width: 70%; height: 70%; object-fit: contain; }

        #help-message { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 400px; padding: 25px; text-align: center; color: white; 
            font-size: 18px; font-family: Arial, sans-serif; background: rgba(0, 0, 0, 0.85); 
            border-radius: 15px; border: 1px solid #555; z-index: 25; transition: opacity 0.5s; 
            opacity: 0; pointer-events: none; cursor: pointer;
            user-select: none; 
        }
        #help-message.visible { opacity: 1; pointer-events: auto; }

        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 100; pointer-events: none;
        }
        .flash-active { animation: flashAnim 0.3s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="start-screen">
        <div class="logo-wrapper" id="logo-container">
            <img src="assets/scanfreakblanklogo.png" class="logo-image" id="main-logo" alt="SCANFREAK AR">
        </div>
        <div id="loading-container"><div id="loading-bar"></div></div>
        <button id="start-btn">PRESS START</button>
    </div>

    <div id="help-btn" class="btn-ui">?</div>
    <a id="cta-btn" class="btn-ui" href="https://scanfreak.myshopify.com" target="_blank">
        <img src="assets/storeicon.png" class="ui-icon" alt="Shop">
    </a>
    <div id="share-btn" class="btn-ui">
        <img src="assets/shareicon.png" class="ui-icon" alt="Share">
    </div>
    
    <div id="screenshot-btn" class="btn-ui">
        <img src="assets/screenshoticon.png" class="ui-icon" alt="Screenshot">
    </div>

    <div id="help-message">Scanner not loading? Pause your VPN, Adblocker or use link above in a default browser like Chrome or Safari.</div>
    <div id="overlay">Point camera at the SCANFREAK design!</div>

    <a-scene id="ar-scene"
        mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true, preserveDrawingBuffer: true, antialias: true, alpha: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

        <a-assets>
            <audio id="sfx-start" src="assets/sfx/start.mp3" preload="auto"></audio>
            <audio id="sfx-startup" src="assets/sfx/startup.mp3" preload="auto"></audio>
            <audio id="sfx-help" src="assets/sfx/help.mp3" preload="auto"></audio>
            <audio id="sfx-store" src="assets/sfx/store.mp3" preload="auto"></audio>
            <audio id="sfx-share" src="assets/sfx/share.mp3" preload="auto"></audio>
            <audio id="sfx-screenshot" src="assets/sfx/screenshot.mp3" preload="auto"></audio>
        </a-assets>

        <script>
            for(let i=0; i<=11; i++) {
                document.write(`<a-entity mindar-image-target="targetIndex: ${i}"><a-plane class="ar-plane" visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>`);
            }
        </script>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
    const COLLECTION_DATA = {
        0: { name: 'wizard', prefix: 'wiz', count: 20, folder: 'wizard' },
        1: { name: 'witch3', prefix: 'wit3', count: 6, folder: 'witch3' },
        2: { name: 'witch2', prefix: 'wit2', count: 6, folder: 'witch2' },
        3: { name: 'witch1', prefix: 'wit1', count: 6, folder: 'witch1' },
        4: { name: 'tealeaf', prefix: 'tea', count: 20, folder: 'tealeaf' },
        5: { name: 'tarot', prefix: 'tar', count: 78, folder: 'tarot' },
        6: { name: 'seer', prefix: 'see', count: 20, folder: 'seer' },
        7: { name: 'portal', prefix: 'por', count: 20, folder: 'portal' },
        8: { name: 'nostradamus', prefix: 'nos', count: 20, folder: 'nostradamus' },
        9: { name: 'mystic', prefix: 'mys', count: 20, folder: 'mystic' },
        10: { name: 'mermaid', prefix: 'mer', count: 20, folder: 'mermaid' },
        11: { name: 'fortune', prefix: 'for', count: 20, folder: 'fortune' }
    };

    const sceneEl = document.querySelector('a-scene');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const loadingContainer = document.getElementById('loading-container');
    const logoContainer = document.getElementById('logo-container');
    const mainLogo = document.getElementById('main-logo');
    const overlay = document.getElementById('overlay');
    const helpBtn = document.getElementById('help-btn');
    const ctaBtn = document.getElementById('cta-btn');
    const shareBtn = document.getElementById('share-btn');
    const screenshotBtn = document.getElementById('screenshot-btn');
    const helpMessage = document.getElementById('help-message');
    const flashOverlay = document.getElementById('flash-overlay');

    const sfxStart = document.getElementById('sfx-start');
    const sfxStartup = document.getElementById('sfx-startup');
    const sfxHelp = document.getElementById('sfx-help');
    const sfxStore = document.getElementById('sfx-store');
    const sfxShare = document.getElementById('sfx-share');
    const sfxScreenshot = document.getElementById('sfx-screenshot');

    let isStarted = false;
    let helpTimeout;
    const videoPool = {}; 
    let currentScale = 1;
    let initialDist = 0;
    
    let lastFoundTargetIndex = null;

    const triggerHaptic = () => { if (navigator.vibrate) navigator.vibrate(50); };

    // --- PINCH ZOOM LOGIC ---
    window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            initialDist = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
            );
        }
    });

    window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && lastFoundTargetIndex !== null) {
            const dist = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
            );
            const delta = dist / initialDist;
            initialDist = dist;

            // Update scale between 0.5x and 3x
            currentScale = Math.min(Math.max(currentScale * delta, 0.5), 3);
            const target = document.querySelector(`[mindar-image-target="targetIndex: ${lastFoundTargetIndex}"]`);
            const plane = target.querySelector('a-plane');
            if (plane) {
                plane.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
            }
        }
    });

    const captureFullImage = async () => {
        return new Promise((resolve) => {
            requestAnimationFrame(() => {
                const allVideos = document.querySelectorAll('video');
                let cameraVideo = null;
                allVideos.forEach(v => {
                    if (v.style.position === 'absolute' || (v.videoWidth > 0 && v.style.display !== 'none' && !Object.values(videoPool).includes(v))) {
                        cameraVideo = v;
                    }
                });

                const arCanvas = sceneEl.canvas;
                const outputCanvas = document.createElement('canvas');
                const ctx = outputCanvas.getContext('2d');
                outputCanvas.width = arCanvas.width;
                outputCanvas.height = arCanvas.height;

                if (cameraVideo) {
                    const videoAspect = cameraVideo.videoWidth / cameraVideo.videoHeight;
                    const canvasAspect = outputCanvas.width / outputCanvas.height;
                    let drawWidth, drawHeight, offsetX, offsetY;
                    if (videoAspect > canvasAspect) {
                        drawHeight = outputCanvas.height;
                        drawWidth = drawHeight * videoAspect;
                        offsetX = -(drawWidth - outputCanvas.width) / 2;
                        offsetY = 0;
                    } else {
                        drawWidth = outputCanvas.width;
                        drawHeight = drawWidth / videoAspect;
                        offsetX = 0;
                        offsetY = -(drawHeight - outputCanvas.height) / 2;
                    }
                    ctx.drawImage(cameraVideo, offsetX, offsetY, drawWidth, drawHeight);
                }
                ctx.drawImage(arCanvas, 0, 0, outputCanvas.width, outputCanvas.height);
                outputCanvas.toBlob((blob) => {
                    const file = new File([blob], "scanfreak_ar.png", { type: "image/png" });
                    resolve(file);
                }, 'image/png');
            });
        });
    };

    const setupTarget = (index) => {
        const data = COLLECTION_DATA[index];
        const target = document.querySelector(`[mindar-image-target="targetIndex: ${index}"]`);
        if (!target) return;
        const plane = target.querySelector('a-plane');
        let isTargetVisible = false;

        const video = document.createElement('video');
        video.crossOrigin = "anonymous";
        video.loop = false;
        video.preload = "auto";
        video.setAttribute('playsinline', ''); 
        video.style.display = 'none';
        document.body.appendChild(video);
        videoPool[index] = video;

        video.onloadeddata = () => {
            if (isTargetVisible) {
                plane.setAttribute('height', video.videoHeight / video.videoWidth);
                plane.setAttribute('material', {src: video, shader: 'flat'});
                plane.setAttribute('visible', true);
                video.play().catch(e => console.log(e));
            }
        };

        target.addEventListener('targetFound', () => {
            if (!isStarted) return; 
            triggerHaptic(); // Haptic feedback on target found
            isTargetVisible = true;
            lastFoundTargetIndex = index; 
            overlay.classList.remove('visible'); 
            helpMessage.classList.remove('visible');
            clearTimeout(helpTimeout);
            [helpBtn, ctaBtn, shareBtn].forEach(btn => btn.classList.remove('visible'));
            screenshotBtn.classList.add('visible'); 
            const rand = Math.floor(Math.random() * data.count) + 1;
            video.src = `videos/collection01/${data.folder}/${data.prefix}${rand}.mp4`;
            video.load(); 
        });

        target.addEventListener('targetLost', () => {
            isTargetVisible = false;
            plane.setAttribute('visible', false);
            currentScale = 1;
            plane.setAttribute('scale', '1 1 1');
            screenshotBtn.classList.remove('visible'); 
            if (isStarted) {
                overlay.classList.add('visible'); 
                [helpBtn, ctaBtn, shareBtn].forEach(btn => btn.classList.add('visible'));
            }
            video.pause();
            if(lastFoundTargetIndex === index) lastFoundTargetIndex = null;
        });
    };

    window.addEventListener('load', () => {
        Object.keys(COLLECTION_DATA).forEach(index => setupTarget(index));
    });

    startBtn.addEventListener('click', () => {
        triggerHaptic();
        sfxStart.play();
        setTimeout(() => sfxStartup.play(), 2000);
        startScreen.classList.add('hidden');
        overlay.classList.add('visible'); 
        [helpBtn, ctaBtn, shareBtn].forEach(btn => btn.classList.add('visible'));
        isStarted = true;
        Object.values(videoPool).forEach(v => v.load());
    });

    helpBtn.addEventListener('click', () => { 
        triggerHaptic(); 
        sfxHelp.play(); 
        const isNowVisible = helpMessage.classList.toggle('visible'); 
        clearTimeout(helpTimeout);
        if(isNowVisible) {
            helpTimeout = setTimeout(() => { helpMessage.classList.remove('visible'); }, 10000);
        }
    });

    helpMessage.addEventListener('click', () => {
        helpMessage.classList.remove('visible');
        clearTimeout(helpTimeout);
    });

    ctaBtn.addEventListener('click', () => { triggerHaptic(); sfxStore.play(); });
    
    shareBtn.addEventListener('click', async () => {
        triggerHaptic();
        sfxShare.currentTime = 0;
        sfxShare.play();

        let shareImagePath;
        let shareFileName;

        if (lastFoundTargetIndex !== null) {
            const data = COLLECTION_DATA[lastFoundTargetIndex];
            shareImagePath = `assets/share/${data.name}_share.png`;
            shareFileName = `${data.name}_share.png`;
        } else {
            shareImagePath = `assets/scanfreakblanklogo.png`;
            shareFileName = `scanfreak_logo.png`;
        }

        if (navigator.share) {
            try {
                const response = await fetch(shareImagePath);
                const blob = await response.blob();
                const file = new File([blob], shareFileName, { type: 'image/png' });

                const shareData = {
                    title: 'SCANFREAK AR',
                    text: "Got my hands on some wild merch. You've got to experience this immersive AR for yourself 👀",
                    url: 'https://scanfreak.myshopify.com',
                    files: [file]
                };

                await navigator.share(shareData);
            } catch (err) { 
                console.log("Share failed", err);
                navigator.share({
                    title: 'SCANFREAK AR',
                    text: "Got my hands on some wild merch. You've got to experience this immersive AR for yourself 👀",
                    url: 'https://scanfreak.myshopify.com'
                });
            }
        }
    });

    screenshotBtn.addEventListener('click', async () => {
        triggerHaptic();
        sfxScreenshot.currentTime = 0;
        sfxScreenshot.play();
        flashOverlay.classList.remove('flash-active');
        void flashOverlay.offsetWidth; 
        flashOverlay.classList.add('flash-active');

        setTimeout(async () => {
            if (navigator.share) {
                try {
                    const imageFile = await captureFullImage();
                    const shareData = {
                        title: 'SCANFREAK AR',
                        text: "The future is now - level up your reality or become obsolete! 👀",
                        url: 'https://scanfreak.myshopify.com',
                        files: [imageFile]
                    };
                    await navigator.share(shareData);
                } catch (err) { console.log("Screenshot share failed", err); }
            }
        }, 150);
    });

    sceneEl.addEventListener("arReady", () => {
        loadingContainer.style.visibility = 'hidden'; 
        logoContainer.classList.add('animate-sweep');
        mainLogo.classList.add('animate-logo');
        setTimeout(() => { startBtn.classList.add('visible'); }, 3000);
    });
    </script>
</body>
</html>
