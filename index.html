<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: none; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; transition: opacity 0.5s;
        }
        #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .logo-wrapper { position: relative; width: 70vw; height: 70vw; max-width: 300px; margin-bottom: 20px; }
        .logo-image { width: 100%; height: 100%; object-fit: contain; }

        #loading-container { width: 200px; height: 4px; background: rgba(255,255,255,0.1); margin-top: 20px; border-radius: 10px; overflow: hidden; }
        #loading-bar { width: 40%; height: 100%; background: #fff; position: absolute; left: -40%; animation: loadingMove 1.5s infinite; }
        @keyframes loadingMove { 0% { left: -40%; } 50% { left: 100%; } 100% { left: -40%; } }

        #start-btn {
            font-family: 'Press Start 2P', cursive; padding: 15px; font-size: 14px; 
            background: white; border: 4px solid #555; border-radius: 15px;
            opacity: 0; transition: opacity 0.8s; cursor: pointer;
        }
        #start-btn.visible { opacity: 1; }

        .btn-ui {
            position: absolute; width: 38px; height: 38px; right: 10px;
            background: rgba(0, 0, 0, 0.5); color: white; border: 2px solid white;
            border-radius: 10px; display: flex; justify-content: center; align-items: center;
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.4s;
        }
        .btn-ui.visible { opacity: 1; pointer-events: auto; }
        
        #help-btn { top: 15px; }
        #cta-btn { top: 60px; } 
        #share-btn { top: 105px; } 
        #info-btn { top: 150px; }
        #flash-btn { top: 195px; }
        #camera-btn { top: 240px; }

        #zoom-indicator {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.7); color: white; padding: 6px 12px;
            border-radius: 20px; font-family: 'Press Start 2P', cursive; font-size: 10px;
            z-index: 60; opacity: 0; pointer-events: none;
        }
        #zoom-indicator.visible { opacity: 1; }

        .msg-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 70%; padding: 20px; text-align: center; color: white; 
            background: rgba(0, 0, 0, 0.9); border-radius: 15px; border: 2px solid #fff;
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .msg-box.visible { opacity: 1; pointer-events: auto; }

        #overlay { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 80%; padding: 10px; color: white; background: rgba(0,0,0,0.5);
            border-radius: 10px; z-index: 40; opacity: 0; pointer-events: none;
        }
        #overlay.visible { opacity: 1; }
        .marquee { display: block; overflow: hidden; white-space: nowrap; }
        .marquee span { display: inline-block; padding-left: 100%; animation: scroll 8s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        
        .ui-icon { width: 70%; height: 70%; }
    </style>
</head>
<body>

    <div id="zoom-indicator">1.0x</div>

    <div id="start-screen">
        <div class="logo-wrapper">
            <img src="assets/scanfreakblanklogo.png" class="logo-image" alt="SCANFREAK">
        </div>
        <div id="loading-container"><div id="loading-bar"></div></div>
        <button id="start-btn">PRESS START</button>
    </div>

    <div id="help-btn" class="btn-ui"><img src="assets/helpicon.png" class="ui-icon"></div>
    <a id="cta-btn" class="btn-ui" href="https://scanfreak.myshopify.com" target="_blank"><img src="assets/storeicon.png" class="ui-icon"></a>
    <div id="share-btn" class="btn-ui"><img src="assets/shareicon.png" class="ui-icon"></div>
    <div id="info-btn" class="btn-ui"><img src="assets/infoicon.png" class="ui-icon"></div>
    <div id="flash-btn" class="btn-ui"><img src="assets/flashicon.png" class="ui-icon"></div>
    <div id="camera-btn" class="btn-ui"><img src="assets/frontcamicon.png" class="ui-icon"></div>

    <div id="help-message" class="msg-box">Scanner not loading? Check your connection or disable VPN.</div>
    <div id="info-message" class="msg-box">New collection details coming soon!</div>
    <div id="flash-unavailable" class="msg-box" style="width: 50%;">Flash unavailable</div>
    
    <div id="overlay" class="marquee"><span>Point camera at the SCANFREAK design!</span></div>

    <a-scene id="ar-scene"
        mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
        embedded color-space="sRGB" renderer="colorManagement: true, preserveDrawingBuffer: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <audio id="sfx-start" src="assets/sfx/start.mp3"></audio>
            <audio id="sfx-startup" src="assets/sfx/startup.mp3"></audio>
            <audio id="sfx-help" src="assets/sfx/help.mp3"></audio>
            <audio id="sfx-store" src="assets/sfx/store.mp3"></audio>
            <audio id="sfx-share" src="assets/sfx/share.mp3"></audio>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <script>
            for(let i=0; i<=11; i++) {
                document.write(`<a-entity mindar-image-target="targetIndex: ${i}"><a-plane class="ar-plane" visible="false" width="0.9" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>`);
            }
        </script>
    </a-scene>

    <script>
    const sceneEl = document.querySelector('a-scene');
    const startBtn = document.getElementById('start-btn');
    const zoomInd = document.getElementById('zoom-indicator');
    const flashBtn = document.getElementById('flash-btn');
    const cameraBtn = document.getElementById('camera-btn');
    const flashMsg = document.getElementById('flash-unavailable');

    let isStarted = false, isFlashOn = false, currentScale = 1, initialDist = 0, lastIdx = null;

    // Haptics & Audio
    const tap = () => navigator.vibrate?.(50);
    const play = (id) => { const a = document.getElementById(id); if(a) { a.currentTime=0; a.play(); }};

    // PINCH ZOOM
    window.addEventListener('touchstart', e => { if(e.touches.length === 2) initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); });
    window.addEventListener('touchmove', e => {
        if (e.touches.length === 2 && lastIdx !== null) {
            const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            const delta = dist / initialDist; initialDist = dist;
            currentScale = Math.min(Math.max(currentScale * delta, 0.5), 3);
            const plane = document.querySelector(`[mindar-image-target="targetIndex: ${lastIdx}"] a-plane`);
            if(plane) {
                plane.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
                zoomInd.innerText = currentScale.toFixed(1) + "x";
                zoomInd.classList.add('visible');
                clearTimeout(window.zT); window.zT = setTimeout(() => zoomInd.classList.remove('visible'), 1500);
            }
        }
    });

    // START
    startBtn.addEventListener('click', () => {
        tap(); play('sfx-start');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('overlay').classList.add('visible');
        document.querySelectorAll('.btn-ui').forEach(b => b.classList.add('visible'));
        isStarted = true;
        setTimeout(() => play('sfx-startup'), 2000);
    });

    // FLASH FIX
    flashBtn.addEventListener('click', async () => {
        tap(); play('sfx-store');
        const video = document.querySelector('video');
        if (!video || !video.srcObject) return showFlashError();
        
        const track = video.srcObject.getVideoTracks()[0];
        const caps = track.getCapabilities();
        
        if (caps.torch) {
            try {
                isFlashOn = !isFlashOn;
                await track.applyConstraints({ advanced: [{ torch: isFlashOn }] });
            } catch (e) { showFlashError(); }
        } else { showFlashError(); }
    });

    function showFlashError() {
        flashMsg.classList.add('visible');
        setTimeout(() => flashMsg.classList.remove('visible'), 3000);
    }

    // CAMERA SWITCH FIX (KILL STREAM)
    cameraBtn.addEventListener('click', async () => {
        tap(); play('sfx-share');
        const system = sceneEl.systems['mindar-image-system'];
        const isUser = sceneEl.getAttribute('mindar-image').includes('user');

        // 1. Fully stop AR
        system.stop();

        // 2. Locate and Kill ALL active camera tracks
        const activeVideos = document.querySelectorAll('video');
        activeVideos.forEach(v => {
            if (v.srcObject) {
                v.srcObject.getTracks().forEach(track => track.stop()); // Hardware off
                v.srcObject = null;
            }
            if (!v.id) v.remove(); // Remove MindAR's auto-generated video
        });

        // 3. Toggle and Re-init
        sceneEl.setAttribute('mindar-image', isUser ? 'facingMode: environment' : 'facingMode: user');
        
        // Short delay to let Android release the hardware lock
        setTimeout(() => {
            system.start();
        }, 600);
    });

    // Target Logic
    sceneEl.addEventListener("arReady", () => {
        document.getElementById('loading-bar').style.animation = "none";
        document.getElementById('loading-bar').style.width = "100%";
        startBtn.classList.add('visible');
    });

    document.querySelectorAll('[mindar-image-target]').forEach(target => {
        target.addEventListener('targetFound', () => { lastIdx = target.getAttribute('mindar-image-target').split(':')[1]; });
        target.addEventListener('targetLost', () => { lastIdx = null; });
    });

    // Message triggers
    document.getElementById('help-btn').addEventListener('click', () => { tap(); play('sfx-help'); document.getElementById('help-message').classList.toggle('visible'); });
    document.getElementById('info-btn').addEventListener('click', () => { tap(); play('sfx-help'); document.getElementById('info-message').classList.toggle('visible'); });
    document.querySelectorAll('.msg-box').forEach(m => m.addEventListener('click', () => m.classList.remove('visible')));
    </script>
</body>
</html>
