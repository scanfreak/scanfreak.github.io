<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }
        #overlay {
            position: absolute; bottom: 20px; left: 0; right: 0;
            padding: 20px; text-align: center; color: white;
            font-size: 24px; font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px black; background: rgba(0, 0, 0, 0.4);
            border-radius: 15px; z-index: 10; transition: opacity 0.5s; pointer-events: none;
        }
        #overlay.hidden { opacity: 0; }
    </style>
</head>
<body>
    <div id="overlay">Point camera at the SCANFREAK design!</div>

    <a-scene 
        mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; filterMinCF: 0.001; filterBeta: 1000;" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

        <a-assets>
            </a-assets>

        <a-entity mindar-image-target="targetIndex: 0"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 1"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 2"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 3"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 4"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 5"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 6"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 7"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 8"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 9"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 10"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>
        <a-entity mindar-image-target="targetIndex: 11"><a-plane width="1" position="0 0 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
        const overlay = document.getElementById('overlay');

        // This matches your map.txt and folder structure
        const collectionMap = {
            0: { folder: 'wizard', prefix: 'wiz', count: 20 },
            1: { folder: 'witch3', prefix: 'wit3', count: 6 },
            2: { folder: 'witch2', prefix: 'wit2', count: 6 },
            3: { folder: 'witch1', prefix: 'wit1', count: 6 },
            4: { folder: 'tealeaf', prefix: 'tea', count: 20 },
            5: { folder: 'tarot', prefix: 'tar', count: 78 },
            6: { folder: 'seer', prefix: 'see', count: 20 },
            7: { folder: 'portal', prefix: 'por', count: 20 },
            8: { folder: 'nostradamus', prefix: 'nos', count: 20 },
            9: { folder: 'mystic', prefix: 'mys', count: 20 },
            10: { folder: 'mermaid', prefix: 'mer', count: 20 },
            11: { folder: 'fortune', prefix: 'for', count: 20 }
        };

        // Track active videos so we can stop them
        const activeVideos = {};

        const setupTarget = (index) => {
            const data = collectionMap[index];
            const target = document.querySelector(`[mindar-image-target="targetIndex: ${index}"]`);
            const plane = target.querySelector('a-plane');

            target.addEventListener('targetFound', () => {
                overlay.classList.add('hidden');

                // Pick a random video
                const rand = Math.floor(Math.random() * data.count) + 1;
                const videoPath = `videos/collection01/${data.folder}/${data.prefix}${rand}.mp4`;

                // Create the video element dynamically
                const video = document.createElement('video');
                video.src = videoPath;
                video.crossOrigin = "anonymous";
                video.loop = false;
                
                video.onloadedmetadata = () => {
                    const ratio = video.videoHeight / video.videoWidth;
                    plane.setAttribute('height', ratio);
                    plane.setAttribute('src', video);
                    video.play();
                };

                activeVideos[index] = video;
            });

            target.addEventListener('targetLost', () => {
                overlay.classList.remove('hidden');
                if (activeVideos[index]) {
                    activeVideos[index].pause();
                    activeVideos[index].src = ""; // Clear memory
                    delete activeVideos[index];
                }
            });
        };

        window.addEventListener('load', () => {
            for (let i = 0; i <= 11; i++) {
                setupTarget(i);
            }
        });
    </script>
</body>
</html>
