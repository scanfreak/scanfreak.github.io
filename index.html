<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SCANFREAK AR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: none; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; z-index: 1; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; transition: opacity 0.5s, visibility 0.5s; user-select: none; }
        #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .logo-wrapper { position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; width: 70vw; height: 70vw; max-width: 300px; max-height: 300px; margin-bottom: 20px; }
        .logo-image { max-width: 90%; max-height: 90%; object-fit: contain; display: block; opacity: 1; }
        .animate-logo { animation: fadeOut 3s ease-in-out forwards; }
        .logo-wrapper::after { content: ""; position: absolute; top: -150%; left: -150%; width: 100%; height: 400%; background: linear-gradient(135deg, transparent, rgba(255,255,255,0.7), transparent); transform: rotate(25deg); }
        .animate-sweep::after { animation: sweep 1.2s ease-in-out forwards; }
        @keyframes sweep { 100% { top: 100%; left: 100%; } }
        @keyframes fadeOut { 0%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }
        #loading-container { width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1); margin-top: 20px; border-radius: 10px; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2); }
        #loading-bar { width: 40%; height: 100%; background: #ffffff; position: absolute; left: -40%; border-radius: 10px; animation: loadingMove 1.5s infinite ease-in-out; box-shadow: 0 0 10px #fff; }
        @keyframes loadingMove { 0% { left: -40%; } 50% { left: 100%; } 100% { left: -40%; } }
        #start-btn { font-family: 'Press Start 2P', cursive; padding: 15px; font-size: 15px; color: black; background: white; border: 4px solid #555; border-radius: 15px; cursor: pointer; text-transform: uppercase; box-shadow: 4px 4px 0px #888; opacity: 0; pointer-events: none; transition: opacity 0.8s ease-in; position: absolute; margin-top: 30px; }
        #start-btn.visible { opacity: 1; pointer-events: auto; animation: pulseBtn 1.5s infinite; }
        @keyframes pulseBtn { 0% { transform: translateY(-50%) scale(1); } 50% { transform: translateY(-50%) scale(1.08); } 100% { transform: translateY(-50%) scale(1); } }
        #scanner-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60vw; height: 60vw; max-width: 320px; max-height: 320px; z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
        #scanner-ui.visible { opacity: 1; }
        .corner { position: absolute; width: 30px; height: 30px; border: 8px solid white; }
        .top-left { top: -4px; left: -4px; border-right: none; border-bottom: none; }
        .top-right { top: -4px; right: -4px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -4px; left: -4px; border-right: none; border-top: none; }
        .bottom-right { bottom: -4px; right: -4px; border-left: none; border-top: none; }
        .scan-line { position: absolute; width: 100%; height: 8px; background: white; top: 0; left: 0; box-shadow: 0 0 20px white; animation: scanMove 2.0s ease-in-out infinite; }
        @keyframes scanMove { 0%, 100% { top: 5%; opacity: 0.3; } 50% { top: 95%; opacity: 1; } }
        #overlay { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 400px; padding: 12px 0; color: white; font-size: 18px; font-family: Arial, sans-serif; text-shadow: 2px 2px 4px black; background: rgba(0, 0, 0, 0.6); border-radius: 12px; z-index: 10; transition: opacity 0.5s; pointer-events: none; opacity: 0; overflow: hidden; white-space: nowrap; }
        #overlay.visible { opacity: 1; }
        .marquee-text { display: inline-block; padding-left: 100%; animation: scroll-left 6.4s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .btn-ui { position: absolute; width: 36px; height: 36px; right: 15px; background: rgba(0, 0, 0, 0.4); color: white; border: 2px solid white; border-radius: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 20; transition: opacity 0.5s; opacity: 0; pointer-events: none; }
        .btn-ui.visible { opacity: 1; pointer-events: auto; }
        #help-btn { top: 15px; } #cta-btn { top: 60px; } #share-btn { top: 105px; } #info-btn { top: 150px; } #flash-btn { top: 195px; }
        #screenshot-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 15px; z-index: 20; display: none; background: rgba(0,0,0,0.4); border: 2px solid white; justify-content: center; align-items: center; user-select: none; -webkit-user-select: none; }
        #screenshot-btn.visible { display: flex; opacity: 1; pointer-events: auto; }
        #screenshot-btn.recording { background: rgba(255, 0, 0, 0.6); border-color: red; animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.1); } 100% { transform: translateX(-50%) scale(1); } }
        #zoom-display { position: absolute; bottom: 15px; right: 15px; font-family: 'Press Start 2P', cursive; font-size: 10px; color: white; background: rgba(0, 0, 0, 0.5); padding: 8px; border-radius: 5px; z-index: 20; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        #zoom-display.visible { opacity: 1; }
        #rec-timer { position: absolute; bottom: 15px; left: 15px; font-family: 'Press Start 2P', cursive; font-size: 10px; color: red; background: rgba(0, 0, 0, 0.6); padding: 8px; border-radius: 5px; z-index: 20; pointer-events: none; opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; gap: 5px; }
        #rec-timer.visible { opacity: 1; }
        .rec-dot { width: 8px; height: 8px; background: red; border-radius: 50%; }
        .ui-icon { width: 70%; height: 70%; object-fit: contain; }
        .msg-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 400px; padding: 25px; text-align: center; color: white; font-size: 18px; font-family: Arial, sans-serif; background: rgba(0, 0, 0, 0.85); border-radius: 15px; border: 1px solid #555; z-index: 25; transition: opacity 0.5s; opacity: 0; pointer-events: none; cursor: pointer; }
        .msg-box.visible { opacity: 1; pointer-events: auto; }
        #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 100; pointer-events: none; }
        .flash-active { animation: flashAnim 0.15s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
        #recording-canvas { position: absolute; top: 0; left: 0; visibility: hidden; z-index: -999; pointer-events: none; }
    </style>
</head>
<body>
    <div id="flash-overlay"></div>
    <div id="scanner-ui">
        <div class="corner top-left"></div><div class="corner top-right"></div>
        <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
        <div class="scan-line"></div>
    </div>
    <div id="start-screen">
        <div class="logo-wrapper" id="logo-container"><img src="assets/scanfreakblanklogo.png" class="logo-image" id="main-logo" alt="SCANFREAK AR"></div>
        <div id="loading-container"><div id="loading-bar"></div></div>
        <button id="start-btn">PRESS START</button>
    </div>
    <div id="help-btn" class="btn-ui"><img src="assets/helpicon.png" class="ui-icon"></div>
    <a id="cta-btn" class="btn-ui" href="https://scanfreak.myshopify.com" target="_blank"><img src="assets/storeicon.png" class="ui-icon"></a>
    <div id="share-btn" class="btn-ui"><img src="assets/shareicon.png" class="ui-icon"></div>
    <div id="info-btn" class="btn-ui"><img src="assets/infoicon.png" class="ui-icon"></div>
    <div id="flash-btn" class="btn-ui"><img src="assets/flashicon.png" class="ui-icon"></div>
    <div id="screenshot-btn" class="btn-ui"><img src="assets/screenshoticon.png" class="ui-icon"></div>
    <div id="zoom-display">ZOOM: 1.0x</div>
    <div id="rec-timer"><div class="rec-dot"></div><span id="rec-time-text">00:00</span></div>
    <div id="help-message" class="msg-box">Scanner not loading? Pause VPN/Adblocker or use Chrome/Safari.</div>
    <div id="info-message" class="msg-box">info update soon</div>
    <div id="flash-error-message" class="msg-box">flash unavailable</div>
    <div id="overlay"><span class="marquee-text">Point camera at the SCANFREAK design!</span></div>
    <canvas id="recording-canvas"></canvas>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; filterMinCF: 0.0001; filterBeta: 0.001; uiScanning: no" renderer="preserveDrawingBuffer: true, alpha: true" embedded>
        <a-assets>
            <audio id="sfx-start" src="assets/sfx/start.mp3" preload="auto"></audio>
            <audio id="sfx-startup" src="assets/sfx/startup.mp3" preload="auto"></audio>
            <audio id="sfx-help" src="assets/sfx/help.mp3" preload="auto"></audio>
            <audio id="sfx-store" src="assets/sfx/store.mp3" preload="auto"></audio>
            <audio id="sfx-share" src="assets/sfx/share.mp3" preload="auto"></audio>
            <audio id="sfx-screenshot" src="assets/sfx/screenshot.mp3" preload="auto"></audio>
            <audio id="sfx-flash" src="assets/sfx/flash.mp3" preload="auto"></audio>
            <audio id="sfx-info" src="assets/sfx/info.mp3" preload="auto"></audio>
        </a-assets>
        <script>
            for(let i=0; i<=23; i++) {
                document.write(`<a-entity mindar-image-target="targetIndex: ${i}"><a-plane class="ar-plane" visible="false" width="1" position="0 0.15 0.05" material="shader: flat; transparent: true"></a-plane></a-entity>`);
            }
        </script>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
    const sceneEl = document.querySelector('a-scene');
    const screenshotBtn = document.getElementById('screenshot-btn');
    const recTimerUi = document.getElementById('rec-timer');
    const recTimeText = document.getElementById('rec-time-text');
    const recordingCanvas = document.getElementById('recording-canvas');
    const flashOverlay = document.getElementById('flash-overlay');

    const sfx = {};
    ['start', 'startup', 'help', 'store', 'share', 'screenshot', 'flash', 'info'].forEach(id => sfx[id] = document.getElementById(`sfx-${id}`));

    let isStarted = false, isRecording = false, recStartTime = 0, recInterval = null, holdTimeout = null;
    let audioCtx = null, audioDest = null, silentGain = null;
    let mediaRecorder = null, recordedChunks = [], animationFrameId = null, compositeCtx = null;
    let cameraVideo = null, lastFoundIndex = null, sessionIndex = null;

    const triggerHaptic = () => { if (navigator.vibrate) navigator.vibrate(50); };

    const setupAudio = () => {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioDest = audioCtx.createMediaStreamDestination();
        
        // FIX: Audio Keep-Alive (Constant signal so Android doesn't drop the track)
        silentGain = audioCtx.createGain();
        silentGain.gain.value = 0.001; 
        const oscillator = audioCtx.createOscillator();
        oscillator.connect(silentGain);
        silentGain.connect(audioDest);
        oscillator.start();

        Object.values(sfx).forEach(el => {
            const source = audioCtx.createMediaElementSource(el);
            source.connect(audioCtx.destination);
            source.connect(audioDest);
        });
    };

    const findCam = () => { cameraVideo = Array.from(document.querySelectorAll('video')).find(v => v.videoWidth > 0 && v.style.display !== 'none' && !v.src.includes('blob')); };

    const startRec = async () => {
        if (isRecording) return;
        findCam();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        
        recordingCanvas.width = sceneEl.canvas.width;
        recordingCanvas.height = sceneEl.canvas.height;
        compositeCtx = recordingCanvas.getContext('2d');

        const loop = () => {
            if (!isRecording) return;
            if (cameraVideo && cameraVideo.readyState >= 2) {
                const vA = cameraVideo.videoWidth / cameraVideo.videoHeight;
                const cA = recordingCanvas.width / recordingCanvas.height;
                let dw, dh, ox, oy;
                if (vA > cA) { dh = recordingCanvas.height; dw = dh * vA; ox = -(dw - recordingCanvas.width) / 2; oy = 0; }
                else { dw = recordingCanvas.width; dh = dw / vA; ox = 0; oy = -(dh - recordingCanvas.height) / 2; }
                compositeCtx.drawImage(cameraVideo, ox, oy, dw, dh);
            }
            compositeCtx.drawImage(sceneEl.canvas, 0, 0);
            animationFrameId = requestAnimationFrame(loop);
        };

        isRecording = true;
        loop();

        const stream = new MediaStream([
            ...recordingCanvas.captureStream(30).getVideoTracks(),
            ...audioDest.stream.getAudioTracks()
        ]);

        let opt = { mimeType: 'video/webm;codecs=vp8,opus' };
        if (!MediaRecorder.isTypeSupported(opt.mimeType)) opt = { mimeType: 'video/mp4' };

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, opt);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        
        mediaRecorder.onstop = async () => {
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
            const file = new File([blob], `scanfreak.${mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm'}`, { type: mediaRecorder.mimeType });

            // TRY SHARING FIRST
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                try { await navigator.share({ title: 'SCANFREAK', files: [file] }); } catch (e) { handleFallback(blob, file.name); }
            } else {
                handleFallback(blob, file.name);
            }
        };

        mediaRecorder.start(100);
        screenshotBtn.classList.add('recording');
        recTimerUi.classList.add('visible');
        recStartTime = Date.now();
        recInterval = setInterval(() => {
            const d = Math.floor((Date.now() - recStartTime) / 1000);
            recTimeText.innerText = `${Math.floor(d/60).toString().padStart(2,'0')}:${(d%60).toString().padStart(2,'0')}`;
        }, 1000);
    };

    const handleFallback = (blob, filename) => {
        // FIX: Permission Check
        if (window.confirm("Recording complete! Would you like to save the video to your device?")) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }
    };

    const stopRec = () => {
        if (!isRecording) return;
        isRecording = false;
        clearInterval(recInterval);
        cancelAnimationFrame(animationFrameId);
        screenshotBtn.classList.remove('recording');
        recTimerUi.classList.remove('visible');
        if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
    };

    screenshotBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        triggerHaptic();
        holdTimeout = setTimeout(() => {
            sfx.flash.play(); triggerHaptic();
            startRec();
            holdTimeout = null;
        }, 1500);
    });

    screenshotBtn.addEventListener('touchend', async (e) => {
        e.preventDefault();
        triggerHaptic(); // FIX: Haptic on Release
        if (holdTimeout) {
            clearTimeout(holdTimeout); holdTimeout = null;
            sfx.screenshot.play();
            flashOverlay.classList.add('flash-active');
            setTimeout(() => flashOverlay.classList.remove('flash-active'), 200);
            // Quick Capture Logic
            const out = document.createElement('canvas');
            out.width = sceneEl.canvas.width; out.height = sceneEl.canvas.height;
            const ctx = out.getContext('2d');
            findCam();
            if (cameraVideo) ctx.drawImage(cameraVideo, 0, 0, out.width, out.height);
            ctx.drawImage(sceneEl.canvas, 0, 0);
            out.toBlob(async b => {
                const f = new File([b], 'capture.jpg', {type:'image/jpeg'});
                if (navigator.share) await navigator.share({files:[f]}).catch(e=>{});
            }, 'image/jpeg');
        } else {
            stopRec();
        }
    });

    document.getElementById('start-btn').addEventListener('click', () => {
        setupAudio();
        document.getElementById('start-screen').classList.add('hidden');
        isStarted = true;
        document.querySelectorAll('.btn-ui').forEach(b => b.classList.add('visible'));
        document.getElementById('overlay').classList.add('visible');
        document.getElementById('scanner-ui').classList.add('visible');
    });

    // AR Target setup (simplified for brevity, matching your existing logic)
    sceneEl.addEventListener('arReady', () => {
        document.getElementById('loading-container').style.display='none';
        document.getElementById('start-btn').classList.add('visible');
    });
    </script>
</body>
</html>
