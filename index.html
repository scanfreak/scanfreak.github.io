<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: none; background: #000; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }

        /* --- UI ELEMENTS --- */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; transition: opacity 0.5s, visibility 0.5s;
        }
        #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .logo-wrapper { position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; width: 70vw; height: 70vw; max-width: 300px; max-height: 300px; margin-bottom: 20px; }
        .logo-image { max-width: 90%; max-height: 90%; object-fit: contain; }
        
        #loading-container { width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1); margin-top: 20px; border-radius: 10px; position: relative; overflow: hidden; }
        #loading-bar { width: 40%; height: 100%; background: #ffffff; position: absolute; left: -40%; animation: loadingMove 1.5s infinite ease-in-out; }
        @keyframes loadingMove { 0% { left: -40%; } 50% { left: 100%; } 100% { left: -40%; } }

        #start-btn { font-family: 'Press Start 2P', cursive; padding: 15px; font-size: 15px; color: black; background: white; border: 4px solid #555; border-radius: 15px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.8s; }
        #start-btn.visible { opacity: 1; pointer-events: auto; }

        #scanner-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60vw; height: 60vw; max-width: 320px; max-height: 320px; z-index: 5; opacity: 0; transition: opacity 0.5s; cursor: pointer; }
        #scanner-ui.visible { opacity: 1; }
        .corner { position: absolute; width: 30px; height: 30px; border: 8px solid white; pointer-events: none; }
        .top-left { top: -4px; left: -4px; border-right: none; border-bottom: none; }
        .top-right { top: -4px; right: -4px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -4px; left: -4px; border-right: none; border-top: none; }
        .bottom-right { bottom: -4px; right: -4px; border-left: none; border-top: none; }
        .scan-line { position: absolute; width: 100%; height: 8px; background: white; top: 0; left: 0; box-shadow: 0 0 20px white; animation: scanMove 2s infinite; }
        @keyframes scanMove { 0%, 100% { top: 5%; } 50% { top: 95%; } }

        .btn-ui { position: absolute; width: 36px; height: 36px; right: 15px; background: rgba(0, 0, 0, 0.4); border: 2px solid white; border-radius: 10px; display: flex; justify-content: center; align-items: center; z-index: 20; opacity: 0; pointer-events: none; }
        .btn-ui.visible { opacity: 1; pointer-events: auto; }
        .ui-icon { width: 70%; height: 70%; }
        #help-btn { top: 15px; } #cta-btn { top: 60px; } #share-btn { top: 105px; } #info-btn { top: 150px; } #flash-btn { top: 195px; }
        #screenshot-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; display: none; }

        /* --- HIDDEN GAME OVERLAY (STAYS INVISIBLE UNTIL TRIGGERED) --- */
        #game-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 2000; display: none; overflow: hidden;
        }
        #dev-bg {
            position: absolute; width: 100%; height: 100%;
            background: url('assets/dev.png') center/contain no-repeat;
            opacity: 1; transition: opacity 2s, transform 1s;
        }
        #game-text {
            position: absolute; top: 15%; width: 100%; text-align: center;
            font-family: 'Press Start 2P', cursive; color: #fff; font-size: 14px; z-index: 2010;
        }
        .red-eye {
            position: absolute; width: 12px; height: 12px; background: #f00;
            box-shadow: 0 0 15px #f00; border-radius: 50%; z-index: 2005; opacity: 0;
        }
        #eye-l { top: 35.96%; left: 28.01%; }
        #eye-r { top: 35.97%; left: 63.11%; }
        .bug { position: absolute; font-size: 40px; z-index: 2050; cursor: pointer; }
    </style>
</head>
<body>

    <div id="scanner-ui">
        <div class="corner top-left"></div><div class="corner top-right"></div>
        <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
        <div class="scan-line"></div>
    </div>

    <div id="start-screen">
        <div class="logo-wrapper"><img src="assets/scanfreakblanklogo.png" class="logo-image"></div>
        <div id="loading-container"><div id="loading-bar"></div></div>
        <button id="start-btn">PRESS START</button>
    </div>

    <div id="help-btn" class="btn-ui"><img src="assets/helpicon.png" class="ui-icon"></div>
    <a id="cta-btn" class="btn-ui" href="https://scanfreak.myshopify.com" target="_blank"><img src="assets/storeicon.png" class="ui-icon"></a>
    <div id="share-btn" class="btn-ui"><img src="assets/shareicon.png" class="ui-icon"></div>
    <div id="info-btn" class="btn-ui"><img src="assets/infoicon.png" class="ui-icon"></div>
    <div id="flash-btn" class="btn-ui"><img src="assets/flashicon.png" class="ui-icon"></div>
    <div id="screenshot-btn" class="btn-ui"><img src="assets/screenshoticon.png" class="ui-icon"></div>

    <div id="game-layer">
        <div id="dev-bg"></div>
        <div id="eye-l" class="red-eye"></div>
        <div id="eye-r" class="red-eye"></div>
        <div id="game-text"></div>
    </div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; uiScanning: no" embedded vr-mode-ui="enabled: false">
        <a-assets>
            <audio id="sfx-start" src="assets/sfx/start.mp3"></audio>
            <audio id="sfx-startup" src="assets/sfx/startup.mp3"></audio>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <script>
            // Generate targets
            for(let i=0; i<=11; i++) {
                document.write(`<a-entity mindar-image-target="targetIndex: ${i}"><a-plane class="ar-plane" visible="false" position="0 0.15 0.05" material="shader: flat; transparent: true"></a-plane></a-entity>`);
            }
        </script>
    </a-scene>

    <script>
    /* --- THE PERFECT SCANNER CODE --- */
    const COLLECTION_DATA = { 0:{n:'wizard',f:'wizard',p:'wiz',c:20}, 1:{n:'witch3',f:'witch3',p:'wit3',c:6}, 2:{n:'witch2',f:'witch2',p:'wit2',c:6}, 3:{n:'witch1',f:'witch1',p:'wit1',c:6}, 4:{n:'tealeaf',f:'tealeaf',p:'tea',c:20}, 5:{n:'tarot',f:'tarot',p:'tar',c:78}, 6:{n:'seer',f:'seer',p:'see',c:20}, 7:{n:'portal',f:'portal',p:'por',c:20}, 8:{n:'nostradamus',f:'nostradamus',p:'nos',c:20}, 9:{n:'mystic',f:'mystic',p:'mys',c:20}, 10:{n:'mermaid',f:'mermaid',p:'mer',c:20}, 11:{n:'fortune',f:'fortune',p:'for',c:20} };

    const videoPool = {};
    let isStarted = false;

    // Start Sequence
    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('sfx-start').play();
        setTimeout(() => document.getElementById('sfx-startup').play(), 2000);
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('scanner-ui').classList.add('visible');
        document.querySelectorAll('.btn-ui').forEach(b => { if(b.id !== 'screenshot-btn') b.classList.add('visible'); });
        isStarted = true;
    });

    // AR Initialization
    document.querySelector('a-scene').addEventListener("arReady", () => {
        document.getElementById('loading-bar').parentElement.style.display = 'none';
        document.getElementById('start-btn').classList.add('visible');
    });

    // Target Logic
    window.addEventListener('load', () => {
        Object.keys(COLLECTION_DATA).forEach(index => {
            const data = COLLECTION_DATA[index];
            const target = document.querySelector(`[mindar-image-target="targetIndex: ${index}"]`);
            const plane = target.querySelector('a-plane');
            const video = document.createElement('video');
            video.crossOrigin = "anonymous"; video.setAttribute('playsinline', '');
            videoPool[index] = video;

            target.addEventListener('targetFound', () => {
                if(!isStarted) return;
                document.getElementById('scanner-ui').classList.remove('visible');
                document.getElementById('screenshot-btn').style.display = 'flex';
                const rand = Math.floor(Math.random() * data.c) + 1;
                video.src = `videos/collection01/${data.f}/${data.p}${rand}.mp4`;
                video.play();
                plane.setAttribute('material', {src: video});
                plane.setAttribute('visible', true);
            });

            target.addEventListener('targetLost', () => {
                video.pause();
                plane.setAttribute('visible', false);
                document.getElementById('scanner-ui').classList.add('visible');
                document.getElementById('screenshot-btn').style.display = 'none';
            });
        });
    });

    /* --- THE HIDDEN GAME (ENCAPSULATED) --- */
    let tapCount = 0;
    let tapTimer;

    document.getElementById('scanner-ui').addEventListener('click', () => {
        if (!isStarted) return;
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => tapCount = 0, 4000);
        if (tapCount >= 9) startTheInfestation();
    });

    function startTheInfestation() {
        const layer = document.getElementById('game-layer');
        const text = document.getElementById('game-text');
        const bg = document.getElementById('dev-bg');
        layer.style.display = 'block';
        text.innerText = "DEV_LINK_ESTABLISHED";

        setTimeout(() => {
            bg.style.opacity = '0.2';
            document.getElementById('eye-r').style.opacity = '1';
            text.innerText = "INFESTATION DETECTED";
            spawnBug();
        }, 2000);
    }

    let hits = 0;
    let misses = 0;
    function spawnBug() {
        if (misses >= 3) { endGame(); return; }
        const bug = document.createElement('div');
        bug.className = 'bug';
        bug.innerText = '🪲';
        bug.style.left = Math.random() * 80 + 10 + '%';
        bug.style.top = Math.random() * 80 + 10 + '%';
        
        const timeout = setTimeout(() => {
            bug.remove();
            misses++;
            spawnBug();
        }, 1200);

        bug.onclick = (e) => {
            e.stopPropagation();
            clearTimeout(timeout);
            bug.remove();
            hits++;
            spawnBug();
        };
        document.getElementById('game-layer').appendChild(bug);
    }

    function endGame() {
        document.getElementById('game-text').innerHTML = `PURGE COMPLETE<br>HITS: ${hits}`;
        document.getElementById('dev-bg').style.transform = 'scale(3)';
        document.getElementById('eye-l').style.opacity = '1';
        setTimeout(() => location.reload(), 4000);
    }
    </script>
</body>
</html>
