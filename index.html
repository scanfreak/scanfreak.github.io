<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    
    <link rel="icon" type="image/png" href="assets/scanfreakblanklogo.png">
    <link rel="apple-touch-icon" href="assets/scanfreakblanklogo.png">
    <meta property="og:image" content="assets/scanfreakblanklogo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: none; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 60; transition: opacity 0.5s, visibility 0.5s;
            user-select: none;
        }
        #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .logo-wrapper {
            position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            width: 70vw; height: 70vw; max-width: 300px; max-height: 300px;
            margin-bottom: 20px;
        }
        .logo-image { max-width: 90%; max-height: 90%; object-fit: contain; display: block; }
        .animate-logo { animation: fadeOut 3s ease-in-out forwards; }
        @keyframes fadeOut { 0%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }

        #loading-container {
            width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1);
            margin-top: 20px; border-radius: 10px; position: relative; overflow: hidden;
        }
        #loading-bar {
            width: 40%; height: 100%; background: #ffffff;
            position: absolute; left: -40%; animation: loadingMove 1.5s infinite;
        }
        @keyframes loadingMove { 0% { left: -40%; } 50% { left: 100%; } 100% { left: -40%; } }

        #start-btn {
            font-family: 'Press Start 2P', cursive; padding: 15px; font-size: 15px;
            background: white; border: 4px solid #555; border-radius: 15px; cursor: pointer;
            opacity: 0; pointer-events: none; transition: opacity 0.8s;
            position: absolute; margin-top: 30px;
        }
        #start-btn.visible { opacity: 1; pointer-events: auto; animation: pulseBtn 1.5s infinite; }
        @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        /* UI BUTTONS - BUMPED Z-INDEX */
        .btn-ui {
            position: absolute; width: 36px; height: 36px; right: 15px;
            background: rgba(0, 0, 0, 0.4); color: white; border: 2px solid white;
            border-radius: 10px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 50; transition: opacity 0.5s;
            opacity: 0; pointer-events: none;
        }
        .btn-ui.visible { opacity: 1; pointer-events: auto !important; }
        .ui-icon { width: 70%; height: 70%; pointer-events: none; }

        #help-btn { top: 15px; }
        #cta-btn { top: 60px; } 
        #share-btn { top: 105px; } 
        #info-btn { top: 150px; }
        #flash-btn { top: 195px; }

        #screenshot-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-110%); width: 60px; height: 60px; border-radius: 15px; display: none; z-index: 50; }
        #record-btn { position: absolute; bottom: 30px; left: 15px; width: 60px; height: 60px; border-radius: 15px; display: none; z-index: 50; }
        #screenshot-btn.visible, #record-btn.visible { display: flex; opacity: 1; pointer-events: auto !important; }

        #record-btn.recording { border-color: #ff0000; animation: pulseRec 1s infinite; }
        @keyframes pulseRec { 0%, 100% { box-shadow: 0 0 0px red; } 50% { box-shadow: 0 0 15px red; } }

        #rec-timer {
            position: absolute; bottom: 45px; right: 15px;
            font-family: 'Press Start 2P', cursive; font-size: 10px;
            color: #ff0000; background: rgba(0, 0, 0, 0.5);
            padding: 8px; border-radius: 5px; z-index: 50; display: none;
        }

        #zoom-display {
            position: absolute; bottom: 15px; right: 15px;
            font-family: 'Press Start 2P', cursive; font-size: 10px;
            color: white; background: rgba(0, 0, 0, 0.5);
            padding: 8px; border-radius: 5px; z-index: 50; opacity: 0;
        }
        #zoom-display.visible { opacity: 1; }

        #scanner-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60vw; height: 60vw; max-width: 320px; max-height: 320px; z-index: 5; pointer-events: none; opacity: 0; }
        #scanner-ui.visible { opacity: 1; }
        .corner { position: absolute; width: 30px; height: 30px; border: 8px solid white; }
        .top-left { top: -4px; left: -4px; border-right: none; border-bottom: none; }
        .top-right { top: -4px; right: -4px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -4px; left: -4px; border-right: none; border-top: none; }
        .bottom-right { bottom: -4px; right: -4px; border-left: none; border-top: none; }

        #overlay { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 400px; padding: 12px 0; color: white; background: rgba(0, 0, 0, 0.6); border-radius: 12px; z-index: 10; opacity: 0; pointer-events: none; overflow: hidden; }
        #overlay.visible { opacity: 1; }
        .marquee-text { display: inline-block; padding-left: 100%; animation: scroll-left 6.4s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .msg-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 400px; padding: 25px; text-align: center; color: white; background: rgba(0, 0, 0, 0.9); border-radius: 15px; border: 2px solid white; z-index: 100; opacity: 0; pointer-events: none; font-family: Arial; }
        .msg-box.visible { opacity: 1; pointer-events: auto; }

        #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 200; pointer-events: none; }
        .flash-active { animation: flashAnim 0.15s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="start-screen">
        <div class="logo-wrapper" id="logo-container">
            <img src="assets/scanfreakblanklogo.png" class="logo-image" id="main-logo" alt="SCANFREAK AR">
        </div>
        <div id="loading-container"><div id="loading-bar"></div></div>
        <button id="start-btn">PRESS START</button>
    </div>

    <div id="help-btn" class="btn-ui"><img src="assets/helpicon.png" class="ui-icon"></div>
    <a id="cta-btn" class="btn-ui" href="https://scanfreak.myshopify.com" target="_blank"><img src="assets/storeicon.png" class="ui-icon"></a>
    <div id="share-btn" class="btn-ui"><img src="assets/shareicon.png" class="ui-icon"></div>
    <div id="info-btn" class="btn-ui"><img src="assets/infoicon.png" class="ui-icon"></div>
    <div id="flash-btn" class="btn-ui"><img src="assets/flashicon.png" class="ui-icon"></div>
    
    <div id="screenshot-btn" class="btn-ui"><img src="assets/screenshoticon.png" class="ui-icon"></div>
    <div id="record-btn" class="btn-ui"><img src="assets/recordicon.png" class="ui-icon"></div>

    <div id="rec-timer">REC: 00:00</div>
    <div id="zoom-display">ZOOM: 1.0x</div>

    <div id="help-message" class="msg-box">Scanner not loading? Pause VPN/Adblocker or use Chrome/Safari.</div>
    <div id="info-message" class="msg-box">info update soon</div>
    <div id="download-prompt" class="msg-box">
        <p>DOWNLOAD RECORDING?</p>
        <button id="download-yes" style="padding:10px; background:white; color:black; border:none; border-radius:5px; margin:5px;">YES</button>
        <button id="download-no" style="padding:10px; background:#555; color:white; border:none; border-radius:5px; margin:5px;">NO</button>
    </div>

    <div id="overlay"><span class="marquee-text">Point camera at the SCANFREAK design!</span></div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; uiScanning: no" embedded vr-mode-ui="enabled: false" renderer="preserveDrawingBuffer: true; antialias: false;">
        <a-assets>
            <audio id="sfx-start" src="assets/sfx/start.mp3" preload="auto"></audio>
            <audio id="sfx-startup" src="assets/sfx/startup.mp3" preload="auto"></audio>
            <audio id="sfx-help" src="assets/sfx/help.mp3" preload="auto"></audio>
            <audio id="sfx-share" src="assets/sfx/share.mp3" preload="auto"></audio>
            <audio id="sfx-screenshot" src="assets/sfx/screenshot.mp3" preload="auto"></audio>
            <audio id="sfx-flash" src="assets/sfx/flash.mp3" preload="auto"></audio>
            <audio id="sfx-info" src="assets/sfx/info.mp3" preload="auto"></audio>
        </a-assets>
        <script>
            for(let i=0; i<=23; i++) {
                document.write(`<a-entity mindar-image-target="targetIndex: ${i}"><a-plane class="ar-plane" visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>`);
            }
        </script>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
    const sceneEl = document.querySelector('a-scene');
    const startBtn = document.getElementById('start-btn');
    const shareBtn = document.getElementById('share-btn');
    const helpBtn = document.getElementById('help-btn');
    const infoBtn = document.getElementById('info-btn');
    const flashBtn = document.getElementById('flash-btn');
    const screenshotBtn = document.getElementById('screenshot-btn');
    const recordBtn = document.getElementById('record-btn');
    const zoomDisplay = document.getElementById('zoom-display');
    const recTimer = document.getElementById('rec-timer');

    const sfxStart = document.getElementById('sfx-start');
    const sfxStartup = document.getElementById('sfx-startup');
    const sfxHelp = document.getElementById('sfx-help');
    const sfxShare = document.getElementById('sfx-share');
    const sfxScreenshot = document.getElementById('sfx-screenshot');
    const sfxFlash = document.getElementById('sfx-flash');
    const sfxInfo = document.getElementById('sfx-info');

    let isStarted = false;
    let cameraVideo = null;
    let isRecording = false;
    let mediaRecorder;
    let recordedChunks = [];
    const videoPool = {};
    let lastFoundTargetIndex = null;
    let currentScale = 1;

    const triggerHaptic = () => { if (navigator.vibrate) navigator.vibrate(50); };

    // --- BUTTON LISTENERS (Restored & Protected) ---

    shareBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation(); // Stop scene from stealing click
        triggerHaptic();
        sfxShare.currentTime = 0; sfxShare.play();
        if (navigator.share) {
            navigator.share({ title: 'SCANFREAK AR', url: window.location.href });
        } else {
            alert("Link copied to clipboard!");
            navigator.clipboard.writeText(window.location.href);
        }
    });

    helpBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        triggerHaptic(); sfxHelp.play();
        document.getElementById('help-message').classList.add('visible');
        setTimeout(() => document.getElementById('help-message').classList.remove('visible'), 5000);
    });

    infoBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        triggerHaptic(); sfxInfo.currentTime = 0; sfxInfo.play();
        document.getElementById('info-message').classList.add('visible');
        setTimeout(() => document.getElementById('info-message').classList.remove('visible'), 5000);
    });

    flashBtn.addEventListener('click', async (e) => {
        e.preventDefault(); e.stopPropagation();
        triggerHaptic(); sfxFlash.currentTime = 0; sfxFlash.play();
        const track = cameraVideo?.srcObject?.getVideoTracks()[0];
        try {
            const status = track.getSettings().torch;
            await track.applyConstraints({ advanced: [{ torch: !status }] });
        } catch (err) { console.log("Flash not supported"); }
    });

    // --- AR LOGIC ---

    const BASE_DATA = [
        { name: 'wizard', prefix: 'wiz', count: 20, folder: 'wizard' },
        { name: 'tealeaf', prefix: 'tea', count: 20, folder: 'tealeaf' },
        { name: 'tarot', prefix: 'tar', count: 78, folder: 'tarot' }
        // ... (remaining items kept in full build)
    ];
    // Re-calculating full COLLECTION_DATA (simplified for brevity here, use full list in your file)
    const COLLECTION_DATA = {};
    for(let i=0; i<24; i++) COLLECTION_DATA[i] = { folder: 'wizard', prefix: 'wiz', count: 20 };

    const setupTarget = (index) => {
        const target = document.querySelector(`[mindar-image-target="targetIndex: ${index}"]`);
        const plane = target.querySelector('a-plane');
        const video = document.createElement('video');
        video.setAttribute('playsinline', ''); video.loop = false; video.crossOrigin = "anonymous";
        videoPool[index] = video;

        target.addEventListener('targetFound', () => {
            if (!isStarted) return;
            triggerHaptic();
            lastFoundTargetIndex = index;
            document.getElementById('scanner-ui').classList.remove('visible');
            document.getElementById('overlay').classList.remove('visible');
            screenshotBtn.classList.add('visible'); recordBtn.classList.add('visible'); zoomDisplay.classList.add('visible');
            
            const data = COLLECTION_DATA[index];
            video.src = `videos/collection01/${data.folder}/${data.prefix}${Math.floor(Math.random()*data.count)+1}.mp4`;
            video.load();
            video.onloadeddata = () => {
                plane.setAttribute('material', {src: video, shader: 'flat'});
                plane.setAttribute('visible', true);
                video.play();
            };
        });

        target.addEventListener('targetLost', () => {
            plane.setAttribute('visible', false); video.pause();
            lastFoundTargetIndex = null;
            if (isStarted && !isRecording) {
                document.getElementById('scanner-ui').classList.add('visible');
                document.getElementById('overlay').classList.add('visible');
                screenshotBtn.classList.remove('visible'); recordBtn.classList.remove('visible'); zoomDisplay.classList.remove('visible');
            }
        });
    };

    startBtn.addEventListener('click', () => {
        triggerHaptic(); sfxStart.play();
        setTimeout(() => sfxStartup.play(), 2000);
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('scanner-ui').classList.add('visible');
        document.getElementById('overlay').classList.add('visible');
        [helpBtn, shareBtn, infoBtn, flashBtn, document.getElementById('cta-btn')].forEach(b => b.classList.add('visible'));
        isStarted = true;
        cameraVideo = document.querySelector('video');
    });

    // --- SCREENSHOT & RECORD (Preserving Quality) ---

    screenshotBtn.addEventListener('click', async () => {
        triggerHaptic(); sfxScreenshot.play();
        document.getElementById('flash-overlay').classList.add('flash-active');
        setTimeout(() => document.getElementById('flash-overlay').classList.remove('flash-active'), 150);
        const canvas = document.createElement('canvas');
        canvas.width = sceneEl.canvas.width; canvas.height = sceneEl.canvas.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
        ctx.drawImage(sceneEl.canvas, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
            const file = new File([blob], "capture.jpg", {type:"image/jpeg"});
            if(navigator.share) navigator.share({files:[file]});
        }, 'image/jpeg');
    });

    recordBtn.addEventListener('click', () => {
        triggerHaptic(); sfxScreenshot.play();
        if (!isRecording) startRec(); else stopRec();
    });

    async function startRec() {
        recordedChunks = [];
        const stream = sceneEl.canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
        mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
        mediaRecorder.onstop = handleStop;
        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add('recording');
        recTimer.style.display = 'block';
    }

    function stopRec() {
        isRecording = false;
        mediaRecorder.stop();
        recordBtn.classList.remove('recording');
        recTimer.style.display = 'none';
    }

    function handleStop() {
        const blob = new Blob(recordedChunks, {type: 'video/mp4'});
        const file = new File([blob], "ar_scan.mp4", {type: 'video/mp4'});
        if(navigator.share) navigator.share({files:[file]});
    }

    window.addEventListener('load', () => {
        for(let i=0; i<24; i++) setupTarget(i);
    });

    sceneEl.addEventListener("arReady", () => {
        document.getElementById('loading-container').style.display = 'none';
        startBtn.classList.add('visible');
    });
    </script>
</body>
</html>
