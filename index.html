<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: none; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; transition: opacity 0.5s, visibility 0.5s;
            user-select: none;
        }

        #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .logo-wrapper {
            position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            width: 70vw; height: 70vw; max-width: 300px; max-height: 300px;
            margin-bottom: 20px;
        }

        .logo-image { max-width: 90%; max-height: 90%; object-fit: contain; display: block; opacity: 1; }
        .animate-logo { animation: fadeOut 3s ease-in-out forwards; }
        
        .logo-wrapper::after {
            content: ""; position: absolute; top: -150%; left: -150%; width: 100%; height: 400%;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.7), transparent);
            transform: rotate(25deg);
        }

        .animate-sweep::after { animation: sweep 1.2s ease-in-out forwards; }
        @keyframes sweep { 100% { top: 100%; left: 100%; } }
        @keyframes fadeOut { 0%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }

        #loading-container {
            width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1);
            margin-top: 20px; border-radius: 10px; position: relative;
            overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #loading-bar {
            width: 40%; height: 100%; background: #ffffff;
            position: absolute; left: -40%; border-radius: 10px;
            animation: loadingMove 1.5s infinite ease-in-out; box-shadow: 0 0 10px #fff;
        }

        @keyframes loadingMove { 0% { left: -40%; } 50% { left: 100%; } 100% { left: -40%; } }

        #start-btn {
            font-family: 'Press Start 2P', cursive; padding: 15px 15px; font-size: 15px; color: black;
            background: white; border: 4px solid #555; border-radius: 15px; cursor: pointer;
            text-transform: uppercase; box-shadow: 4px 4px 0px #888; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease-in; position: absolute; margin-top: 30px; 
        }

        #start-btn.visible { opacity: 1; pointer-events: auto; animation: pulseBtn 1.5s infinite; }
        
        @keyframes pulseBtn { 
            0% { transform: translateY(-50%) scale(1); } 
            50% { transform: translateY(-50%) scale(1.08); box-shadow: 0 0 15px rgba(255,255,255,0.4); } 
            100% { transform: translateY(-50%) scale(1); } 
        }
        
        #start-btn:active { transform: translateY(-50%) translate(4px, 4px); box-shadow: none; }

        #overlay { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px; padding: 12px 0;
            color: white; font-size: 18px; font-family: Arial, sans-serif; 
            text-shadow: 2px 2px 4px black; background: rgba(0, 0, 0, 0.6); 
            border-radius: 12px; z-index: 10; transition: opacity 0.5s; 
            pointer-events: none; opacity: 0; 
            overflow: hidden; white-space: nowrap;
        }
        #overlay.visible { opacity: 1; }

        .marquee-text {
            display: inline-block; padding-left: 100%;
            animation: scroll-left 10s linear infinite;
        }

        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .btn-ui {
            position: absolute; width: 36px; height: 36px; 
            right: 10px; 
            background: rgba(0, 0, 0, 0.4); color: white; border: 2px solid white;
            border-radius: 10px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 20; transition: opacity 0.5s;
            opacity: 0; pointer-events: none; text-decoration: none; overflow: hidden;
        }
        .btn-ui.visible { opacity: 1; pointer-events: auto; }
        
        #help-btn { top: 15px; }
        #cta-btn { top: 60px; } 
        #share-btn { top: 105px; } 
        #info-btn { top: 150px; }
        #flash-btn { top: 195px; }
        #msg-btn { top: 240px; }

        #screenshot-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 60px; border-radius: 15px; z-index: 20;
            display: none;
        }
        #screenshot-btn.visible { display: flex; opacity: 1; pointer-events: auto; }

        .ui-icon { width: 70%; height: 70%; object-fit: contain; }

        .msg-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 400px; padding: 25px; text-align: center; color: white; 
            font-size: 18px; font-family: Arial, sans-serif; background: rgba(0, 0, 0, 0.85); 
            border-radius: 15px; border: 1px solid #555; z-index: 25; transition: opacity 0.5s; 
            opacity: 0; pointer-events: none; cursor: pointer; user-select: none; 
        }
        .msg-box.visible { opacity: 1; pointer-events: auto; }
        
        #flash-unavailable { width: 60%; max-width: 250px; padding: 15px; font-size: 16px; }

        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 100; pointer-events: none;
        }
        .flash-active { animation: flashAnim 0.3s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="start-screen">
        <div class="logo-wrapper" id="logo-container">
            <img src="assets/scanfreakblanklogo.png" class="logo-image" id="main-logo" alt="SCANFREAK AR">
        </div>
        <div id="loading-container"><div id="loading-bar"></div></div>
        <button id="start-btn">PRESS START</button>
    </div>

    <div id="help-btn" class="btn-ui"><img src="assets/helpicon.png" class="ui-icon" alt="Help"></div>
    <a id="cta-btn" class="btn-ui" href="https://scanfreak.myshopify.com" target="_blank"><img src="assets/storeicon.png" class="ui-icon" alt="Shop"></a>
    <div id="share-btn" class="btn-ui"><img src="assets/shareicon.png" class="ui-icon" alt="Share"></div>
    <div id="info-btn" class="btn-ui"><img src="assets/infoicon.png" class="ui-icon" alt="Info"></div>
    <div id="flash-btn" class="btn-ui"><img src="assets/flashicon.png" class="ui-icon" alt="Flash"></div>
    <div id="msg-btn" class="btn-ui"><img src="assets/msgicon.png" class="ui-icon" alt="Message"></div>
    
    <div id="screenshot-btn" class="btn-ui"><img src="assets/screenshoticon.png" class="ui-icon" alt="Screenshot"></div>

    <div id="help-message" class="msg-box">Scanner not loading? Pause your VPN, Adblocker or use link above in a default browser like Chrome or Safari.</div>
    <div id="info-message" class="msg-box">New info will be placed here soon!</div>
    <div id="custom-msg-box" class="msg-box">You clicked the message icon! Leave your message or feedback here.</div>
    <div id="flash-unavailable" class="msg-box">Flash unavailable</div>
    
    <div id="overlay"><span class="marquee-text">Point camera at the SCANFREAK design!</span></div>

    <script>
        // Pinch to Zoom Component
        AFRAME.registerComponent('pinch-zoom', {
            schema: {
                min: {type: 'number', default: 1},
                max: {type: 'number', default: 5}
            },
            init: function () {
                this.initialZoom = 1;
                this.currentZoom = 1;
                this.initialDistance = 0;
                
                this.el.sceneEl.canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        this.initialDistance = Math.hypot(
                            e.touches[0].pageX - e.touches[1].pageX,
                            e.touches[0].pageY - e.touches[1].pageY
                        );
                        this.initialZoom = this.currentZoom;
                    }
                });

                this.el.sceneEl.canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && this.initialDistance > 0) {
                        const currentDistance = Math.hypot(
                            e.touches[0].pageX - e.touches[1].pageX,
                            e.touches[0].pageY - e.touches[1].pageY
                        );
                        
                        const zoomFactor = currentDistance / this.initialDistance;
                        let newZoom = this.initialZoom * zoomFactor;
                        
                        // Clamp zoom values
                        newZoom = Math.min(Math.max(newZoom, this.data.min), this.data.max);
                        
                        this.currentZoom = newZoom;
                        this.el.setAttribute('camera', 'zoom', newZoom);
                    }
                });

                this.el.sceneEl.canvas.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2) {
                        this.initialDistance = 0;
                    }
                });
            }
        });
    </script>

    <a-scene id="ar-scene"
        mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true, preserveDrawingBuffer: true, antialias: true, alpha: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

        <a-assets>
            <audio id="sfx-start" src="assets/sfx/start.mp3" preload="auto"></audio>
            <audio id="sfx-startup" src="assets/sfx/startup.mp3" preload="auto"></audio>
            <audio id="sfx-help" src="assets/sfx/help.mp3" preload="auto"></audio>
            <audio id="sfx-store" src="assets/sfx/store.mp3" preload="auto"></audio>
            <audio id="sfx-share" src="assets/sfx/share.mp3" preload="auto"></audio>
            <audio id="sfx-screenshot" src="assets/sfx/screenshot.mp3" preload="auto"></audio>
        </a-assets>

        <script>
            for(let i=0; i<=11; i++) {
                document.write(`<a-entity mindar-image-target="targetIndex: ${i}"><a-plane class="ar-plane" visible="false" width="0.8" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>`);
            }
        </script>

        <a-camera position="0 0 0" look-controls="enabled: false" pinch-zoom="min: 1; max: 4"></a-camera>
    </a-scene>

    <script>
    const COLLECTION_DATA = {
        0: { name: 'wizard', prefix: 'wiz', count: 20, folder: 'wizard' },
        1: { name: 'witch3', prefix: 'wit3', count: 6, folder: 'witch3' },
        2: { name: 'witch2', prefix: 'wit2', count: 6, folder: 'witch2' },
        3: { name: 'witch1', prefix: 'wit1', count: 6, folder: 'witch1' },
        4: { name: 'tealeaf', prefix: 'tea', count: 20, folder: 'tealeaf' },
        5: { name: 'tarot', prefix: 'tar', count: 78, folder: 'tarot' },
        6: { name: 'seer', prefix: 'see', count: 20, folder: 'seer' },
        7: { name: 'portal', prefix: 'por', count: 20, folder: 'portal' },
        8: { name: 'nostradamus', prefix: 'nos', count: 20, folder: 'nostradamus' },
        9: { name: 'mystic', prefix: 'mys', count: 20, folder: 'mystic' },
        10: { name: 'mermaid', prefix: 'mer', count: 20, folder: 'mermaid' },
        11: { name: 'fortune', prefix: 'for', count: 20, folder: 'fortune' }
    };

    const sceneEl = document.querySelector('a-scene');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const helpBtn = document.getElementById('help-btn');
    const ctaBtn = document.getElementById('cta-btn');
    const shareBtn = document.getElementById('share-btn');
    const infoBtn = document.getElementById('info-btn');
    const flashBtn = document.getElementById('flash-btn');
    const msgBtn = document.getElementById('msg-btn');
    const screenshotBtn = document.getElementById('screenshot-btn');
    const helpMessage = document.getElementById('help-message');
    const infoMessage = document.getElementById('info-message');
    const customMsgBox = document.getElementById('custom-msg-box');
    const flashMsgBox = document.getElementById('flash-unavailable');
    const flashOverlay = document.getElementById('flash-overlay');

    const sfxStart = document.getElementById('sfx-start'), sfxStartup = document.getElementById('sfx-startup');
    const sfxHelp = document.getElementById('sfx-help'), sfxStore = document.getElementById('sfx-store');
    const sfxShare = document.getElementById('sfx-share'), sfxScreenshot = document.getElementById('sfx-screenshot');

    let isStarted = false, helpTimeout, infoTimeout, msgTimeout, flashTimeout, isFlashOn = false, lastFoundTargetIndex = null;
    const videoPool = {};

    const triggerHaptic = () => { if (navigator.vibrate) navigator.vibrate(50); };

    const setupTarget = (index) => {
        const data = COLLECTION_DATA[index];
        const target = document.querySelector(`[mindar-image-target="targetIndex: ${index}"]`);
        if (!target) return;
        const plane = target.querySelector('a-plane');
        let isTargetVisible = false;
        const video = document.createElement('video');
        video.crossOrigin = "anonymous"; video.loop = false; video.preload = "auto";
        video.setAttribute('playsinline', ''); video.style.display = 'none';
        document.body.appendChild(video);
        videoPool[index] = video;

        video.onloadeddata = () => {
            if (isTargetVisible) {
                plane.setAttribute('height', video.videoHeight / video.videoWidth);
                plane.setAttribute('material', {src: video, shader: 'flat'});
                plane.setAttribute('visible', true);
                video.play().catch(e => console.log(e));
            }
        };

        target.addEventListener('targetFound', () => {
            if (!isStarted) return; 
            triggerHaptic(); isTargetVisible = true; lastFoundTargetIndex = index; 
            overlay.classList.remove('visible'); 
            [helpMessage, infoMessage, customMsgBox, flashMsgBox].forEach(m => m.classList.remove('visible'));
            [helpBtn, ctaBtn, shareBtn, infoBtn, flashBtn, msgBtn].forEach(btn => btn.classList.remove('visible'));
            screenshotBtn.classList.add('visible'); 
            const rand = Math.floor(Math.random() * data.count) + 1;
            video.src = `videos/collection01/${data.folder}/${data.prefix}${rand}.mp4`;
            video.load(); 
        });

        target.addEventListener('targetLost', () => {
            isTargetVisible = false; plane.setAttribute('visible', false);
            screenshotBtn.classList.remove('visible'); 
            if (isStarted) {
                overlay.classList.add('visible'); 
                [helpBtn, ctaBtn, shareBtn, infoBtn, flashBtn, msgBtn].forEach(btn => btn.classList.add('visible'));
            }
            video.pause();
        });
    };

    window.addEventListener('load', () => Object.keys(COLLECTION_DATA).forEach(index => setupTarget(index)));

    startBtn.addEventListener('click', () => {
        triggerHaptic(); sfxStart.play();
        setTimeout(() => sfxStartup.play(), 2000);
        startScreen.classList.add('hidden');
        overlay.classList.add('visible'); 
        [helpBtn, ctaBtn, shareBtn, infoBtn, flashBtn, msgBtn].forEach(btn => btn.classList.add('visible'));
        isStarted = true;
        Object.values(videoPool).forEach(v => v.load());
    });

    helpBtn.addEventListener('click', () => { 
        triggerHaptic(); sfxHelp.play(); 
        const isVisible = helpMessage.classList.toggle('visible'); 
        [infoMessage, customMsgBox, flashMsgBox].forEach(m => m.classList.remove('visible'));
        clearTimeout(helpTimeout);
        if(isVisible) helpTimeout = setTimeout(() => helpMessage.classList.remove('visible'), 10000);
    });

    infoBtn.addEventListener('click', () => {
        triggerHaptic(); sfxHelp.play(); 
        const isVisible = infoMessage.classList.toggle('visible'); 
        [helpMessage, customMsgBox, flashMsgBox].forEach(m => m.classList.remove('visible'));
        clearTimeout(infoTimeout);
        if(isVisible) infoTimeout = setTimeout(() => infoMessage.classList.remove('visible'), 10000);
    });

    msgBtn.addEventListener('click', () => {
        triggerHaptic(); sfxHelp.play(); 
        const isVisible = customMsgBox.classList.toggle('visible'); 
        [helpMessage, infoMessage, flashMsgBox].forEach(m => m.classList.remove('visible'));
        clearTimeout(msgTimeout);
        if(isVisible) msgTimeout = setTimeout(() => customMsgBox.classList.remove('visible'), 10000);
    });

    flashBtn.addEventListener('click', async () => {
        triggerHaptic(); sfxStore.play();
        const videoTrack = document.querySelector('video').srcObject?.getVideoTracks()[0];
        if (videoTrack && videoTrack.getCapabilities().torch) {
            isFlashOn = !isFlashOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: isFlashOn }] });
        } else {
            const isVisible = flashMsgBox.classList.toggle('visible');
            [helpMessage, infoMessage, customMsgBox].forEach(m => m.classList.remove('visible'));
            clearTimeout(flashTimeout);
            if(isVisible) flashTimeout = setTimeout(() => flashMsgBox.classList.remove('visible'), 5000);
        }
    });

    [helpMessage, infoMessage, customMsgBox, flashMsgBox].forEach(msg => msg.addEventListener('click', () => msg.classList.remove('visible')));
    ctaBtn.addEventListener('click', () => { triggerHaptic(); sfxStore.play(); });

    shareBtn.addEventListener('click', async () => {
        triggerHaptic(); sfxShare.currentTime = 0; sfxShare.play();
        let path = lastFoundTargetIndex !== null ? `assets/share/${COLLECTION_DATA[lastFoundTargetIndex].name}_share.png` : `assets/scanfreakblanklogo.png`;
        if (navigator.share) {
            try {
                const res = await fetch(path);
                const blob = await res.blob();
                const file = new File([blob], "share.png", { type: 'image/png' });
                await navigator.share({ title: 'SCANFREAK AR', text: "Check this out!", url: 'https://scanfreak.myshopify.com', files: [file] });
            } catch (e) { navigator.share({ title: 'SCANFREAK AR', url: 'https://scanfreak.myshopify.com' }); }
        }
    });

    screenshotBtn.addEventListener('click', async () => {
        triggerHaptic(); sfxScreenshot.currentTime = 0; sfxScreenshot.play();
        flashOverlay.classList.remove('flash-active'); void flashOverlay.offsetWidth; flashOverlay.classList.add('flash-active');
        setTimeout(async () => {
            if (navigator.share) {
                try {
                    // Note: captureFullImage must be defined elsewhere or handled via scene renderer
                    const canvas = sceneEl.components.screenshot.getCanvas('perspective');
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    const img = new File([blob], "screenshot.png", { type: 'image/png' });
                    await navigator.share({ title: 'SCANFREAK AR', files: [img] });
                } catch (e) {}
            }
        }, 150);
    });

    sceneEl.addEventListener("arReady", () => {
        document.getElementById('loading-container').style.visibility = 'hidden'; 
        document.getElementById('logo-container').classList.add('animate-sweep');
        document.getElementById('main-logo').classList.add('animate-logo');
        setTimeout(() => startBtn.classList.add('visible'), 3000);
    });
    </script>
</body>
</html>
