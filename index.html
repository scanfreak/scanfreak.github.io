<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
}

    a-scene {
        position: fixed !important;
        top: 0;
        left: 0;
        width: 100vw !important;
        height: 100vh !important;
}
    a-scene canvas {
        background: transparent !important;
}

    #overlay {
        position: absolute;
        bottom: 20px;              /* Bottom of screen */
        left: 0; right: 0;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
        text-shadow: 2px 2px 4px black; /* Makes text pop */
        text-align: center;
        font-family: Arial, sans-serif;
        background: rgba(0, 0, 0, 0.4);   /* text background */
        border-radius: 15px 15px 15px 15px;     /* Rounded corners */
        pointer-events: none;             /* Doesn't block camera */
        z-index: 10;
        transition: opacity 0.5s;         /* Smooth fade when hiding */
    }
    #overlay.hidden {
        opacity: 0;
    }
    </style>
</head>
<body>
    <div id="overlay">Point camera at the SCANFREAK design!</div>

    <a-scene 
        mindar-image="imageTargetSrc: descriptors/collection01/wisewizard/wisewizard.mind; filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 5; missTolerance: 10;" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
        embedded>

        <a-assets timeout="10000">
            <video id="vid1" src="videos/collection01/wisewizard/wisewizard01.mp4" crossorigin="anonymous"></video>
            <video id="vid2" src="videos/collection01/wisewizard/wisewizard02.mp4" crossorigin="anonymous"></video>
            <video id="vid3" src="videos/collection01/wisewizard/wisewizard03.mp4" crossorigin="anonymous"></video>
            <video id="vid4" src="videos/collection01/nostradamus/nostradamus01.mp4" crossorigin="anonymous"></video>
            <video id="vid5" src="videos/collection01/nostradamus/nostradamus02.mp4" crossorigin="anonymous"></video>
            <video id="vid6" src="videos/collection01/nostradamus/nostradamus03.mp4" crossorigin="anonymous"></video>



            <!-- Add more <video> lines here for additional videos (vid4, etc.) -->
        </a-assets>

        <a-entity mindar-image-target="targetIndex: 0" lock-rotation>
            <a-plane
                id="videoPlane"
                width="1"
                  
                position="0 0 0.05"
                material="shader: flat; side: double"
                animation="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 500; startEvents: targetFound"
                animation__hide="property: scale; to: 0.1 0.1 0.1; dur: 500; startEvents: targetLost">
            </a-plane>
        </a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
    // 1. Select the random video
    const videos = ['#vid1', '#vid2', '#vid3'];
    const randomVideoId = videos[Math.floor(Math.random() * videos.length)];
    
    // 2. Get references to our elements
    const videoEl = document.querySelector(randomVideoId);
    const plane = document.getElementById('videoPlane');
    const targetEntity = document.querySelector('a-entity[mindar-image-target]');
    const overlay = document.getElementById('overlay');

    // 3. Assign the video to the plane
    plane.setAttribute('src', randomVideoId);

    // 4. Function to dynamically resize the plane to match video aspect ratio
    const resizePlaneToVideo = () => {
        const videoWidth = videoEl.videoWidth;
        const videoHeight = videoEl.videoHeight;
        
        if (videoWidth && videoHeight) {
            // Calculate ratio (Height / Width)
            const ratio = videoHeight / videoWidth;
            
            // Apply the new height to the plane (keeping width at 1)
            plane.setAttribute('height', ratio);
            
            console.log(`Resized plane to: 1 x ${ratio} (Video: ${videoWidth}x${videoHeight})`);
        }
    };

    // 5. Trigger resize logic
    // We check readyState in case the video is already cached/loaded
    if (videoEl.readyState >= 1) {
        resizePlaneToVideo();
    } else {
        videoEl.addEventListener('loadedmetadata', resizePlaneToVideo);
    }

    // 6. Handle Target Found
    targetEntity.addEventListener('targetFound', () => {
        overlay.classList.add('hidden');
        videoEl.play();
    });

    // 7. Handle Target Lost
    targetEntity.addEventListener('targetLost', () => {
        overlay.classList.remove('hidden');
        videoEl.pause(); // Good practice to pause video when not visible
    });
</script>
