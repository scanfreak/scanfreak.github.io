<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        #video { width: 100vw; height: 100vh; object-fit: cover; }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; /* Allows camera interaction */
            color: white; font-family: Arial, sans-serif; font-size: 24px;
            text-align: center; background: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay">
        Point your camera at a SCANFREAK t-shirt design!
    </div>

    <script>
        const video = document.getElementById('video');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' } // Uses back camera on phones
                });
                video.srcObject = stream;
            } catch (err) {
                document.getElementById('overlay').innerText = 
                    'Camera access denied or not available. Please allow camera and reload.';
                console.error(err);
            }
        }

        startCamera();
    </script>
</body>
</html>
