<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: none; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; transition: opacity 0.5s, visibility 0.5s;
            user-select: none;
        }

        #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .logo-wrapper {
            position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            width: 70vw; height: 70vw; max-width: 300px; max-height: 300px;
            margin-bottom: 20px;
        }

        .logo-image { max-width: 90%; max-height: 90%; object-fit: contain; display: block; opacity: 1; }
        .animate-logo { animation: fadeOut 3s ease-in-out forwards; }
        
        .logo-wrapper::after {
            content: ""; position: absolute; top: -150%; left: -150%; width: 100%; height: 400%;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.7), transparent);
            transform: rotate(25deg);
        }

        .animate-sweep::after { animation: sweep 1.2s ease-in-out forwards; }
        @keyframes sweep { 100% { top: 100%; left: 100%; } }
        @keyframes fadeOut { 0%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }

        #loading-container {
            width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1);
            margin-top: 20px; border-radius: 10px; position: relative;
            overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #loading-bar {
            width: 40%; height: 100%; background: #ffffff;
            position: absolute; left: -40%; border-radius: 10px;
            animation: loadingMove 1.5s infinite ease-in-out; box-shadow: 0 0 10px #fff;
        }

        @keyframes loadingMove { 0% { left: -40%; } 50% { left: 100%; } 100% { left: -40%; } }

        #start-btn {
            font-family: 'Press Start 2P', cursive; padding: 15px 15px; font-size: 15px; color: black;
            background: white; border: 4px solid #555; border-radius: 15px; cursor: pointer;
            text-transform: uppercase; box-shadow: 4px 4px 0px #888; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease-in; position: absolute; margin-top: 30px; 
        }

        #start-btn.visible { opacity: 1; pointer-events: auto; animation: pulseBtn 1.5s infinite; }
        
        @keyframes pulseBtn { 
            0% { transform: translateY(-50%) scale(1); } 
            50% { transform: translateY(-50%) scale(1.08); box-shadow: 0 0 15px rgba(255,255,255,0.4); } 
            100% { transform: translateY(-50%) scale(1); } 
        }
        
        #start-btn:active { transform: translateY(-50%) translate(4px, 4px); box-shadow: none; }

        #overlay { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px; padding: 12px 0;
            color: white; font-size: 18px; font-family: Arial, sans-serif; 
            text-shadow: 2px 2px 4px black; background: rgba(0, 0, 0, 0.6); 
            border-radius: 12px; z-index: 10; transition: opacity 0.5s; 
            pointer-events: none; opacity: 0; 
            overflow: hidden; white-space: nowrap;
        }
        #overlay.visible { opacity: 1; }

        .marquee-text {
            display: inline-block; padding-left: 100%;
            animation: scroll-left 10s linear infinite;
        }

        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .btn-ui {
            position: absolute; width: 36px; height: 36px; right: 10px;
            background: rgba(0, 0, 0, 0.4); color: white; border: 2px solid white;
            border-radius: 10px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 20; transition: opacity 0.5s;
            opacity: 0; pointer-events: none; text-decoration: none; overflow: hidden;
        }
        .btn-ui.visible { opacity: 1; pointer-events: auto; }
        
        #help-btn { top: 15px; }
        #cta-btn { top: 60px; } 
        #share-btn { top: 105px; } 
        #info-btn { top: 150px; }
        #flash-btn { top: 195px; }
        #camera-btn { top: 240px; }

        #zoom-indicator {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.6); color: white; padding: 5px 10px;
            border-radius: 20px; font-family: 'Press Start 2P', cursive;
            font-size: 10px; z-index: 21; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.3);
        }
        #zoom-indicator.visible { opacity: 1; }

        .ui-icon { width: 70%; height: 70%; object-fit: contain; }

        .msg-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 400px; padding: 25px; text-align: center; color: white; 
            font-size: 18px; font-family: Arial, sans-serif; background: rgba(0, 0, 0, 0.85); 
            border-radius: 15px; border: 1px solid #555; z-index: 25; transition: opacity 0.5s; 
            opacity: 0; pointer-events: none; cursor: pointer; user-select: none; 
        }
        .msg-box.visible { opacity: 1; pointer-events: auto; }
        #flash-unavailable { width: 60%; max-width: 250px; padding: 15px; font-size: 16px; }
    </style>
</head>
<body>

    <div id="zoom-indicator">1.0x</div>

    <div id="start-screen">
        <div class="logo-wrapper" id="logo-container">
            <img src="assets/scanfreakblanklogo.png" class="logo-image" id="main-logo" alt="SCANFREAK AR">
        </div>
        <div id="loading-container"><div id="loading-bar"></div></div>
        <button id="start-btn">PRESS START</button>
    </div>

    <div id="help-btn" class="btn-ui"><img src="assets/helpicon.png" class="ui-icon"></div>
    <a id="cta-btn" class="btn-ui" href="https://scanfreak.myshopify.com" target="_blank"><img src="assets/storeicon.png" class="ui-icon"></a>
    <div id="share-btn" class="btn-ui"><img src="assets/shareicon.png" class="ui-icon"></div>
    <div id="info-btn" class="btn-ui"><img src="assets/infoicon.png" class="ui-icon"></div>
    <div id="flash-btn" class="btn-ui"><img src="assets/flashicon.png" class="ui-icon"></div>
    <div id="camera-btn" class="btn-ui"><img src="assets/frontcamicon.png" class="ui-icon"></div>
    
    <div id="help-message" class="msg-box">Scanner not loading? Pause your VPN, Adblocker or use link above in a default browser like Chrome or Safari.</div>
    <div id="info-message" class="msg-box">New info will be placed here soon!</div>
    <div id="flash-unavailable" class="msg-box">Flash unavailable</div>
    
    <div id="overlay"><span class="marquee-text">Point camera at the SCANFREAK design!</span></div>

    <a-scene id="ar-scene"
        mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true, preserveDrawingBuffer: true, antialias: true, alpha: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

        <a-assets>
            <audio id="sfx-start" src="assets/sfx/start.mp3" preload="auto"></audio>
            <audio id="sfx-startup" src="assets/sfx/startup.mp3" preload="auto"></audio>
            <audio id="sfx-help" src="assets/sfx/help.mp3" preload="auto"></audio>
            <audio id="sfx-store" src="assets/sfx/store.mp3" preload="auto"></audio>
            <audio id="sfx-share" src="assets/sfx/share.mp3" preload="auto"></audio>
        </a-assets>

        <script>
            for(let i=0; i<=11; i++) {
                document.write(`<a-entity mindar-image-target="targetIndex: ${i}"><a-plane class="ar-plane" visible="false" width="0.9" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>`);
            }
        </script>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
    const sceneEl = document.querySelector('a-scene');
    const startBtn = document.getElementById('start-btn');
    const flashBtn = document.getElementById('flash-btn');
    const cameraBtn = document.getElementById('camera-btn');
    const zoomInd = document.getElementById('zoom-indicator');
    const flashMsg = document.getElementById('flash-unavailable');

    let isStarted = false, isFlashOn = false, lastFoundIdx = null, currentScale = 1, initialDist = 0;

    const tap = () => navigator.vibrate?.(50);
    const play = (id) => { const a = document.getElementById(id); if(a) { a.currentTime=0; a.play(); }};

    // PINCH ZOOM
    window.addEventListener('touchstart', e => { if(e.touches.length === 2) initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); });
    window.addEventListener('touchmove', e => {
        if (e.touches.length === 2 && lastFoundIdx !== null) {
            const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            const delta = dist / initialDist; initialDist = dist;
            currentScale = Math.min(Math.max(currentScale * delta, 0.5), 3);
            const plane = document.querySelector(`[mindar-image-target="targetIndex: ${lastFoundIdx}"] a-plane`);
            if(plane) {
                plane.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
                zoomInd.innerText = currentScale.toFixed(1) + "x";
                zoomInd.classList.add('visible');
                clearTimeout(window.zT); window.zT = setTimeout(() => zoomInd.classList.remove('visible'), 1500);
            }
        }
    });

    startBtn.addEventListener('click', () => {
        tap(); play('sfx-start');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('overlay').classList.add('visible');
        document.querySelectorAll('.btn-ui').forEach(b => b.classList.add('visible'));
        isStarted = true;
        setTimeout(() => play('sfx-startup'), 2000);
    });

    // FLASH REPAIR
    flashBtn.addEventListener('click', async () => {
        tap(); play('sfx-store');
        try {
            const video = document.querySelector('video');
            if (!video || !video.srcObject) throw "err";
            const track = video.srcObject.getVideoTracks()[0];
            const caps = track.getCapabilities();
            if (caps.torch) {
                isFlashOn = !isFlashOn;
                await track.applyConstraints({ advanced: [{ torch: isFlashOn }] });
            } else { throw "err"; }
        } catch (e) {
            flashMsg.classList.add('visible');
            setTimeout(() => flashMsg.classList.remove('visible'), 3000);
        }
    });

    // CAMERA SWITCH - HARD RESET
    cameraBtn.addEventListener('click', async () => {
        tap(); play('sfx-share');
        const system = sceneEl.systems['mindar-image-system'];
        const isUser = sceneEl.getAttribute('mindar-image').includes('user');

        system.stop();
        document.querySelectorAll('video').forEach(v => {
            if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            if (!v.id) v.remove();
        });

        sceneEl.setAttribute('mindar-image', isUser ? 'facingMode: environment' : 'facingMode: user');
        setTimeout(() => system.start(), 500);
    });

    sceneEl.addEventListener("arReady", () => {
        document.getElementById('loading-container').style.visibility = 'hidden'; 
        document.getElementById('logo-container').classList.add('animate-sweep');
        document.getElementById('main-logo').classList.add('animate-logo');
        setTimeout(() => startBtn.classList.add('visible'), 3000);
    });

    document.querySelectorAll('[mindar-image-target]').forEach(t => {
        t.addEventListener('targetFound', () => { lastFoundIdx = t.getAttribute('mindar-image-target').split(':')[1]; });
        t.addEventListener('targetLost', () => { lastFoundIdx = null; });
    });

    document.getElementById('help-btn').addEventListener('click', () => { tap(); play('sfx-help'); document.getElementById('help-message').classList.toggle('visible'); });
    document.getElementById('info-btn').addEventListener('click', () => { tap(); play('sfx-help'); document.getElementById('info-message').classList.toggle('visible'); });
    document.querySelectorAll('.msg-box').forEach(m => m.addEventListener('click', () => m.classList.remove('visible')));
    </script>
</body>
</html>
