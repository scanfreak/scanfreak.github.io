<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SCANFREAK AR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: none; background: #000; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }

        /* Timer UI */
        #rec-timer {
            position: absolute; bottom: 20px; left: 20px;
            font-family: 'Press Start 2P', cursive; font-size: 12px;
            color: #ff0000; background: rgba(0,0,0,0.6);
            padding: 8px; border-radius: 5px; display: none; z-index: 25;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; transition: opacity 0.5s;
        }
        #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .logo-wrapper { position: relative; width: 70vw; height: 70vw; max-width: 300px; max-height: 300px; margin-bottom: 20px; }
        .logo-image { max-width: 90%; max-height: 90%; object-fit: contain; }
        .animate-logo { animation: fadeOut 3s ease-in-out forwards; }
        
        @keyframes fadeOut { 0%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }

        #loading-container { width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; }
        #loading-bar { width: 40%; height: 100%; background: #fff; position: absolute; animation: loadingMove 1.5s infinite; }
        @keyframes loadingMove { 0% { left: -40%; } 50% { left: 100%; } 100% { left: -40%; } }

        #start-btn {
            font-family: 'Press Start 2P', cursive; padding: 15px; font-size: 15px;
            background: white; border: 4px solid #555; border-radius: 15px; 
            opacity: 0; pointer-events: none; transition: opacity 0.8s;
        }
        #start-btn.visible { opacity: 1; pointer-events: auto; }

        /* UI Elements */
        #scanner-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60vw; height: 60vw; max-width: 320px; max-height: 320px;
            z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
        #scanner-ui.visible { opacity: 1; }
        .corner { position: absolute; width: 30px; height: 30px; border: 8px solid white; }
        .top-left { top: -4px; left: -4px; border-right: none; border-bottom: none; }
        .top-right { top: -4px; right: -4px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -4px; left: -4px; border-right: none; border-top: none; }
        .bottom-right { bottom: -4px; right: -4px; border-left: none; border-top: none; }
        .scan-line { position: absolute; width: 100%; height: 8px; background: white; box-shadow: 0 0 20px white; animation: scanMove 2s infinite; }
        @keyframes scanMove { 0%, 100% { top: 5%; opacity: 0.3; } 50% { top: 95%; opacity: 1; } }

        .btn-ui {
            position: absolute; width: 44px; height: 44px; right: 15px;
            background: rgba(0, 0, 0, 0.5); color: white; border: 2px solid white;
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .btn-ui.visible { opacity: 1; pointer-events: auto; }
        #help-btn { top: 15px; } #cta-btn { top: 70px; } #share-btn { top: 125px; } #info-btn { top: 180px; } #flash-btn { top: 235px; }

        #screenshot-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px; border-radius: 50%; border: 5px solid white;
            background: rgba(255,255,255,0.2); display: none; z-index: 25;
        }
        #screenshot-btn.visible { display: flex; }
        #screenshot-btn.recording { border-color: #ff0000; background: rgba(255,0,0,0.3); transform: translateX(-50%) scale(1.1); }

        .msg-box { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 400px; padding: 25px; text-align: center; color: white; 
            background: rgba(0, 0, 0, 0.9); border-radius: 15px; border: 1px solid #555; 
            z-index: 40; display: none; cursor: pointer;
        }
        .msg-box.visible { display: block; }

        #overlay { 
            position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
            width: 80%; background: rgba(0,0,0,0.6); border-radius: 20px; padding: 10px 0;
            color: white; font-family: sans-serif; text-align: center; z-index: 10; opacity: 0; overflow: hidden;
        }
        #overlay.visible { opacity: 1; }
        #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 100; pointer-events: none; }
        .flash-active { animation: flashAnim 0.15s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>
    <div id="rec-timer">REC 00:00</div>

    <div id="scanner-ui">
        <div class="corner top-left"></div><div class="corner top-right"></div>
        <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
        <div class="scan-line"></div>
    </div>

    <div id="start-screen">
        <div class="logo-wrapper" id="logo-container">
            <img src="assets/scanfreakblanklogo.png" class="logo-image" id="main-logo" alt="SCANFREAK">
        </div>
        <div id="loading-container"><div id="loading-bar"></div></div>
        <button id="start-btn">PRESS START</button>
    </div>

    <div id="help-btn" class="btn-ui"><img src="assets/helpicon.png" style="width:70%" alt="?"></div>
    <a id="cta-btn" class="btn-ui" href="https://scanfreak.myshopify.com" target="_blank"><img src="assets/storeicon.png" style="width:70%" alt="S"></a>
    <div id="share-btn" class="btn-ui"><img src="assets/shareicon.png" style="width:70%" alt="Sh"></div>
    <div id="info-btn" class="btn-ui"><img src="assets/infoicon.png" style="width:70%" alt="I"></div>
    <div id="flash-btn" class="btn-ui"><img src="assets/flashicon.png" style="width:70%" alt="F"></div>
    <div id="screenshot-btn" class="btn-ui"></div>

    <div id="help-message" class="msg-box">Scanner not loading? Pause VPN/Adblock or open in Chrome/Safari.</div>
    <div id="info-message" class="msg-box">INFO UPDATE SOON</div>
    <div id="browser-warning" class="msg-box"><b>RESTRICTED BROWSER DETECTED</b><br><br>For the best AR experience, tap the three dots or share icon and <b>"Open in Browser"</b> (Chrome/Safari).</div>

    <div id="overlay"><span id="marquee">Point camera at the SCANFREAK design!</span></div>

    <a-scene id="ar-scene"
        mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; filterMinCF: 0.0001; filterBeta: 0.001; uiScanning: no" 
        renderer="preserveDrawingBuffer: true, antialias: false, alpha: true" 
        vr-mode-ui="enabled: false" embedded>

        <a-assets>
            <audio id="sfx-start" src="assets/sfx/start.mp3" preload="auto"></audio>
            <audio id="sfx-startup" src="assets/sfx/startup.mp3" preload="auto"></audio>
            <audio id="sfx-help" src="assets/sfx/help.mp3" preload="auto"></audio>
            <audio id="sfx-store" src="assets/sfx/store.mp3" preload="auto"></audio>
            <audio id="sfx-share" src="assets/sfx/share.mp3" preload="auto"></audio>
            <audio id="sfx-screenshot" src="assets/sfx/screenshot.mp3" preload="auto"></audio>
            <audio id="sfx-flash" src="assets/sfx/flash.mp3" preload="auto"></audio>
            <audio id="sfx-info" src="assets/sfx/info.mp3" preload="auto"></audio>
        </a-assets>

        <script>
            for(let i=0; i<=23; i++) {
                document.write(`<a-entity mindar-image-target="targetIndex: ${i}"><a-plane class="ar-plane" visible="false" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>`);
            }
        </script>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
    const BASE_DATA = [
        { name: 'wizard', prefix: 'wiz', count: 20, folder: 'wizard' },
        { name: 'witch3', prefix: 'wit3', count: 6, folder: 'witch3' },
        { name: 'witch2', prefix: 'wit2', count: 6, folder: 'witch2' },
        { name: 'witch1', prefix: 'wit1', count: 6, folder: 'witch1' },
        { name: 'tealeaf', prefix: 'tea', count: 20, folder: 'tealeaf' },
        { name: 'tarot', prefix: 'tar', count: 78, folder: 'tarot' },
        { name: 'seer', prefix: 'see', count: 20, folder: 'seer' },
        { name: 'portal', prefix: 'por', count: 20, folder: 'portal' },
        { name: 'nostradamus', prefix: 'nos', count: 20, folder: 'nostradamus' },
        { name: 'mystic', prefix: 'mys', count: 20, folder: 'mystic' },
        { name: 'mermaid', prefix: 'mer', count: 20, folder: 'mermaid' },
        { name: 'fortune', prefix: 'for', count: 20, folder: 'fortune' }
    ];

    const COLLECTION_DATA = {};
    BASE_DATA.forEach((d, i) => { COLLECTION_DATA[i] = d; COLLECTION_DATA[i + 12] = d; });

    const sceneEl = document.querySelector('a-scene');
    const screenshotBtn = document.getElementById('screenshot-btn');
    const recTimer = document.getElementById('rec-timer');
    const flashOverlay = document.getElementById('flash-overlay');
    const startBtn = document.getElementById('start-btn');
    
    let audioCtx, streamDest, mediaRecorder, recordedChunks = [];
    let recordStartTime, timerInterval, holdTimeout, isRecording = false;
    let cameraVideo = null;
    let lastFoundTargetIndex = null;
    let sessionPersistentTargetIndex = null;
    const videoPool = {};

    // 1. Audio Setup & In-App Browser Detection
    const initAudioCapture = () => {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        streamDest = audioCtx.createMediaStreamDestination();
        document.querySelectorAll('audio').forEach(audio => {
            const source = audioCtx.createMediaElementSource(audio);
            source.connect(audioCtx.destination);
            source.connect(streamDest);
        });
    };

    const checkBrowser = () => {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isRestricted = /Instagram|FBAN|FBAV|Snapchat|TikTok|MicroMessenger/i.test(ua);
        if (isRestricted) document.getElementById('browser-warning').classList.add('visible');
    };

    // 2. Dual-Function Button Logic
    const startRecording = async () => {
        if (isRecording) return;
        isRecording = true;
        recordedChunks = [];
        
        const canvasStream = sceneEl.canvas.captureStream(30);
        const combinedStream = new MediaStream([
            ...canvasStream.getVideoTracks(),
            ...streamDest.stream.getAudioTracks()
        ]);

        const types = ['video/mp4;codecs=h264', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
        const supportedType = types.find(t => MediaRecorder.isTypeSupported(t));

        mediaRecorder = new MediaRecorder(combinedStream, { mimeType: supportedType });
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        
        mediaRecorder.onstop = async () => {
            const blob = new Blob(recordedChunks, { type: supportedType.split(';')[0] });
            const file = new File([blob], "scanfreak_ar.mp4", { type: blob.type });
            if (navigator.share) {
                await navigator.share({
                    title: 'SCANFREAK AR',
                    text: 'SCANFREAK MERCH - Check this out!',
                    files: [file]
                }).catch(() => {});
            }
        };

        mediaRecorder.start();
        recordStartTime = Date.now();
        recTimer.style.display = 'block';
        screenshotBtn.classList.add('recording');
        
        timerInterval = setInterval(() => {
            const diff = Math.floor((Date.now() - recordStartTime) / 1000);
            const m = String(Math.floor(diff / 60)).padStart(2, '0');
            const s = String(diff % 60).padStart(2, '0');
            recTimer.innerText = `REC ${m}:${s}`;
        }, 1000);
    };

    const stopRecording = () => {
        if (!isRecording) return;
        isRecording = false;
        clearInterval(timerInterval);
        recTimer.style.display = 'none';
        screenshotBtn.classList.remove('recording');
        if (mediaRecorder) mediaRecorder.stop();
    };

    const takeScreenshot = async () => {
        document.getElementById('sfx-screenshot').play();
        flashOverlay.classList.add('flash-active');
        setTimeout(() => flashOverlay.classList.remove('flash-active'), 200);
        
        const outputCanvas = document.createElement('canvas');
        const ctx = outputCanvas.getContext('2d');
        outputCanvas.width = sceneEl.canvas.width;
        outputCanvas.height = sceneEl.canvas.height;
        
        if (!cameraVideo) cameraVideo = document.querySelector('video');
        if (cameraVideo) ctx.drawImage(cameraVideo, 0, 0, outputCanvas.width, outputCanvas.height);
        ctx.drawImage(sceneEl.canvas, 0, 0);

        outputCanvas.toBlob(async (blob) => {
            const file = new File([blob], "scanfreak.jpg", { type: "image/jpeg" });
            if (navigator.share) {
                await navigator.share({
                    title: 'SCANFREAK AR',
                    text: 'Level up your reality! 👀',
                    files: [file]
                }).catch(() => {});
            }
        }, 'image/jpeg', 0.9);
    };

    // 3. UI Toggle Tweaks
    const toggleMsg = (el) => {
        const isVisible = el.classList.contains('visible');
        document.querySelectorAll('.msg-box').forEach(m => m.classList.remove('visible'));
        if (!isVisible) el.classList.add('visible');
    };

    // 4. Input Handlers
    screenshotBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        holdTimeout = setTimeout(() => {
            if (navigator.vibrate) navigator.vibrate(100);
            document.getElementById('sfx-flash').play();
            startRecording();
        }, 1500);
    });

    screenshotBtn.addEventListener('touchend', () => {
        clearTimeout(holdTimeout);
        if (isRecording) {
            stopRecording();
        } else {
            takeScreenshot();
        }
    });

    // Button Toggles
    document.getElementById('help-btn').addEventListener('click', () => { 
        document.getElementById('sfx-help').play();
        toggleMsg(document.getElementById('help-message')); 
    });
    document.getElementById('info-btn').addEventListener('click', () => { 
        document.getElementById('sfx-info').play();
        toggleMsg(document.getElementById('info-message')); 
    });
    
    // Close on message click
    document.querySelectorAll('.msg-box').forEach(box => {
        box.addEventListener('click', () => box.classList.remove('visible'));
    });

    // 5. Target Logic (Simplified from original)
    const setupTarget = (index) => {
        const data = COLLECTION_DATA[index];
        const target = document.querySelector(`[mindar-image-target="targetIndex: ${index}"]`);
        const plane = target.querySelector('a-plane');
        const video = document.createElement('video');
        video.crossOrigin="anonymous"; video.loop=false; video.setAttribute('playsinline','');
        videoPool[index] = video;

        video.onloadeddata = () => {
            plane.setAttribute('height', video.videoHeight / video.videoWidth);
            plane.setAttribute('material', {src: video, shader: 'flat'});
            plane.setAttribute('visible', true);
            video.play();
        };

        target.addEventListener('targetFound', () => {
            sessionPersistentTargetIndex = index;
            lastFoundTargetIndex = index;
            screenshotBtn.classList.add('visible');
            const rand = Math.floor(Math.random() * data.count) + 1;
            video.src = `videos/collection01/${data.folder}/${data.prefix}${rand}.mp4`;
            video.load();
        });

        target.addEventListener('targetLost', () => {
            plane.setAttribute('visible', false);
            screenshotBtn.classList.remove('visible');
            video.pause();
        });
    };

    window.addEventListener('load', () => {
        checkBrowser();
        Object.keys(COLLECTION_DATA).forEach(setupTarget);
    });

    startBtn.addEventListener('click', () => {
        initAudioCapture();
        document.getElementById('sfx-start').play();
        document.getElementById('start-screen').classList.add('hidden');
        document.querySelectorAll('.btn-ui').forEach(b => b.classList.add('visible'));
        document.getElementById('overlay').classList.add('visible');
        document.getElementById('scanner-ui').classList.add('visible');
    });

    sceneEl.addEventListener("arReady", () => {
        document.getElementById('loading-container').style.display = 'none';
        document.getElementById('main-logo').classList.add('animate-logo');
        setTimeout(() => startBtn.classList.add('visible'), 2000);
    });
    </script>
</body>
</html>
