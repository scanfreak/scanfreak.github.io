<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
        position: absolute;
        bottom: 20px;              /* Bottom of screen */
        left: 0; right: 0;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
        text-shadow: 2px 2px 4px black; /* Makes text pop */
        text-align: center;
        font-family: Arial, sans-serif;
        background: rgba(0, 0, 0, 0.4);   /* text background */
        border-radius: 15px 15px 15px 15px;     /* Rounded corners */
        pointer-events: none;             /* Doesn't block camera */
        z-index: 10;
        transition: opacity 0.5s;         /* Smooth fade when hiding */
    }
    #overlay.hidden {
        opacity: 0;
    }
    </style>
</head>
<body>
    <div id="overlay">Point camera at the SCANFREAK design!</div>

    <a-scene 
        mindar-image="imageTargetSrc: descriptors/collection01/wisewizard/wisewizard.mind; filterMinCF: 0.001; filterBeta: 1000; warmupTolerance: 5; missTolerance: 10;" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
        embedded background="black">

            <a-assets timeout="10000">
    <video id="vid1" src="videos/collection01/wisewizard/wisewizard01.mp4" loop="true" crossorigin="anonymous" webkit-playsinline playsinline></video>
    <video id="vid2" src="videos/collection01/wisewizard/wisewizard02.mp4" loop="true" crossorigin="anonymous" webkit-playsinline playsinline></video>
    <video id="vid3" src="videos/collection01/wisewizard/wisewizard03.mp4" loop="true" crossorigin="anonymous" webkit-playsinline playsinline></video>
    <!-- Add more videos here the same way -->
</a-assets>

<a-entity mindar-image-target="targetIndex: 0">
    <a-video 
        id="arVideo"
        src="#randomVideo" 
        position="0 0 0.05"   <!-- Slight forward offset so it's in front of the image -->
        rotation="-90 0 0"    <!-- Lays flat on the target (common fix) -->
        width="1" height="1"  <!-- Adjust to match your wisewizardpic.png aspect ratio, e.g., width="1.5" height="1" if wider -->
        playsinline
    ></a-video>
        </a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
    const videos = ['#vid1', '#vid2', '#vid3']; // Add more '#vid4' etc.
    const randomVideoId = videos[Math.floor(Math.random() * videos.length)];
    
    // Set the random video source
    const arVideo = document.querySelector('#arVideo');
    arVideo.setAttribute('src', randomVideoId);

    // Hide/show overlay + play/pause video properly
    const scene = document.querySelector('a-scene');
    const overlay = document.getElementById('overlay');
    
    scene.addEventListener('targetFound', () => {
        overlay.style.display = 'none';
        const videoEl = document.querySelector(randomVideoId);
        if (videoEl) videoEl.play();
    });
    
    scene.addEventListener('targetLost', () => {
        overlay.style.display = 'flex';
        const videoEl = document.querySelector(randomVideoId);
        if (videoEl) videoEl.pause();
    });
</script>
</body>
</html>
