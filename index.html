<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SCANFREAK AR</title>
    
    <link rel="icon" type="image/png" href="assets/scanfreakblanklogo.png">
    <link rel="apple-touch-icon" href="assets/scanfreakblanklogo.png">
    <meta property="og:image" content="assets/scanfreakblanklogo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: none; }
        a-scene { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; transition: opacity 0.5s, visibility 0.5s;
            user-select: none;
        }

        #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .logo-wrapper {
            position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            width: 70vw; height: 70vw; max-width: 300px; max-height: 300px;
            margin-bottom: 20px;
        }

        .logo-image { max-width: 90%; max-height: 90%; object-fit: contain; display: block; opacity: 1; }
        .animate-logo { animation: fadeOut 3s ease-in-out forwards; }
        
        .logo-wrapper::after {
            content: ""; position: absolute; top: -150%; left: -150%; width: 100%; height: 400%;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.7), transparent);
            transform: rotate(25deg);
        }

        .animate-sweep::after { animation: sweep 1.2s ease-in-out forwards; }
        @keyframes sweep { 100% { top: 100%; left: 100%; } }
        @keyframes fadeOut { 0%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }

        #loading-container {
            width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1);
            margin-top: 20px; border-radius: 10px; position: relative;
            overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #loading-bar {
            width: 40%; height: 100%; background: #ffffff;
            position: absolute; left: -40%; border-radius: 10px;
            animation: loadingMove 1.5s infinite ease-in-out; box-shadow: 0 0 10px #fff;
        }

        @keyframes loadingMove { 0% { left: -40%; } 50% { left: 100%; } 100% { left: -40%; } }

        #start-btn {
            font-family: 'Press Start 2P', cursive; padding: 15px 15px; font-size: 15px; color: black;
            background: white; border: 4px solid #555; border-radius: 15px; cursor: pointer;
            text-transform: uppercase; box-shadow: 4px 4px 0px #888; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease-in; 
            position: absolute; 
            margin-top: 30px; 
        }

        #start-btn.visible { opacity: 1; pointer-events: auto; animation: pulseBtn 1.5s infinite; }
        
        @keyframes pulseBtn { 
            0% { transform: translateY(-50%) scale(1); } 
            50% { transform: translateY(-50%) scale(1.08); box-shadow: 0 0 15px rgba(255,255,255,0.4); } 
            100% { transform: translateY(-50%) scale(1); } 
        }
        
        #start-btn:active { transform: translateY(-50%) translate(4px, 4px); box-shadow: none; }

        #scanner-ui {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw; height: 60vw;
            max-width: 320px; max-height: 320px;
            border: 2px solid rgba(255, 255, 255, 0);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #scanner-ui.visible { opacity: 1; }

        .corner {
            position: absolute; width: 30px; height: 30px;
            border: 8px solid white;
        }
        .top-left { top: -4px; left: -4px; border-right: none; border-bottom: none; }
        .top-right { top: -4px; right: -4px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -4px; left: -4px; border-right: none; border-top: none; }
        .bottom-right { bottom: -4px; right: -4px; border-left: none; border-top: none; }

        .scan-line {
            position: absolute; width: 100%; height: 8px;
            background: white; top: 0; left: 0;
            box-shadow: 0 0 20px white;
            animation: scanMove 2.0s ease-in-out infinite;
        }

        @keyframes scanMove {
            0%, 100% { top: 5%; opacity: 0.3; }
            50% { top: 95%; opacity: 1; }
        }

        #overlay { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px; padding: 12px 0;
            color: white; font-size: 18px; font-family: Arial, sans-serif; 
            text-shadow: 2px 2px 4px black; background: rgba(0, 0, 0, 0.6); 
            border-radius: 12px; z-index: 10; transition: opacity 0.5s; 
            pointer-events: none; opacity: 0; 
            overflow: hidden; white-space: nowrap;
        }
        #overlay.visible { opacity: 1; }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: scroll-left 6.4s linear infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .btn-ui {
            position: absolute; width: 36px; height: 36px; right: 15px;
            background: rgba(0, 0, 0, 0.4); color: white; border: 2px solid white;
            border-radius: 10px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 50; transition: opacity 0.5s;
            opacity: 0; pointer-events: none; text-decoration: none; overflow: hidden;
        }
        .btn-ui.visible { opacity: 1; pointer-events: auto !important; }
        
        #help-btn { top: 15px; }
        #cta-btn { top: 60px; } 
        #share-btn { top: 105px; } 
        #info-btn { top: 150px; }
        #flash-btn { top: 195px; }

        #screenshot-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-110%);
            width: 60px; height: 60px; border-radius: 15px; z-index: 20;
            display: none;
        }
        #screenshot-btn.visible { display: flex; opacity: 1; pointer-events: auto; }

        #record-btn {
            position: absolute; bottom: 30px; left: 15px; 
            width: 60px; height: 60px; border-radius: 15px; z-index: 20;
            display: none;
        }
        #record-btn.visible { display: flex; opacity: 1; pointer-events: auto; }
        #record-btn.recording { border-color: #ff0000; animation: pulseRec 1s infinite; }
        @keyframes pulseRec { 0% { box-shadow: 0 0 0px red; } 50% { box-shadow: 0 0 15px red; } 100% { box-shadow: 0 0 0px red; } }

        #rec-timer {
            position: absolute; bottom: 45px; right: 15px;
            font-family: 'Press Start 2P', cursive; font-size: 10px;
            color: #ff0000; background: rgba(0, 0, 0, 0.5);
            padding: 8px; border-radius: 5px; z-index: 20;
            pointer-events: none; display: none;
        }

        #zoom-display {
            position: absolute; bottom: 15px; right: 15px;
            font-family: 'Press Start 2P', cursive; font-size: 10px;
            color: white; background: rgba(0, 0, 0, 0.5);
            padding: 8px; border-radius: 5px; z-index: 20;
            pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }
        #zoom-display.visible { opacity: 1; }

        .ui-icon { width: 70%; height: 70%; object-fit: contain; }

        .msg-box { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 400px; padding: 25px; text-align: center; color: white; 
            font-size: 18px; font-family: 'Press Start 2P', cursive; background: rgba(0, 0, 0, 0.9); 
            border-radius: 15px; border: 2px solid white; z-index: 40; transition: opacity 0.5s; 
            opacity: 0; pointer-events: none; 
        }
        .msg-box.visible { opacity: 1; pointer-events: auto; }
        
        .prompt-container { display: flex; justify-content: space-around; margin-top: 20px; }
        .prompt-btn {
            padding: 10px 20px; font-family: 'Press Start 2P', cursive; font-size: 12px;
            background: white; color: black; border: none; border-radius: 8px; cursor: pointer;
        }
        .prompt-btn:active { transform: scale(0.9); }
        .prompt-btn.no { background: #555; color: white; }

        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 100; pointer-events: none;
        }
        .flash-active { animation: flashAnim 0.15s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="scanner-ui">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
        <div class="scan-line"></div>
    </div>

    <div id="start-screen">
        <div class="logo-wrapper" id="logo-container">
            <img src="assets/scanfreakblanklogo.png" class="logo-image" id="main-logo" alt="SCANFREAK AR">
        </div>
        <div id="loading-container"><div id="loading-bar"></div></div>
        <button id="start-btn">PRESS START</button>
    </div>

    <div id="help-btn" class="btn-ui"><img src="assets/helpicon.png" class="ui-icon"></div>
    <a id="cta-btn" class="btn-ui" href="https://scanfreak.myshopify.com" target="_blank"><img src="assets/storeicon.png" class="ui-icon"></a>
    <div id="share-btn" class="btn-ui"><img src="assets/shareicon.png" class="ui-icon"></div>
    <div id="info-btn" class="btn-ui"><img src="assets/infoicon.png" class="ui-icon"></div>
    <div id="flash-btn" class="btn-ui"><img src="assets/flashicon.png" class="ui-icon"></div>
    <div id="screenshot-btn" class="btn-ui"><img src="assets/screenshoticon.png" class="ui-icon"></div>
    <div id="record-btn" class="btn-ui"><img src="assets/recordicon.png" class="ui-icon"></div>

    <div id="rec-timer">REC: 00:00</div>
    <div id="zoom-display">ZOOM: 1.0x</div>

    <div id="help-message" class="msg-box" style="font-family: Arial;">Scanner not loading? Pause your VPN, Adblocker or use link above in a default browser like Chrome or Safari.</div>
    <div id="info-message" class="msg-box" style="font-family: Arial;">info update soon</div>
    <div id="flash-error-message" class="msg-box" style="width: auto; padding: 15px; font-family: Arial;">flash unavailable</div>
    
    <div id="download-prompt" class="msg-box">
        <p style="font-size: 10px; line-height: 1.5;">DOWNLOAD RECORDING?</p>
        <div class="prompt-container">
            <button id="download-yes" class="prompt-btn">YES</button>
            <button id="download-no" class="prompt-btn no">NO</button>
        </div>
    </div>
    
    <div id="overlay">
        <span class="marquee-text">Point camera at the SCANFREAK design!</span>
    </div>

    <a-scene id="ar-scene"
        mindar-image="imageTargetSrc: descriptors/collection01/collection01.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5; uiScanning: no" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true, preserveDrawingBuffer: true, antialias: false, alpha: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

        <a-assets>
            <audio id="sfx-start" src="assets/sfx/start.mp3" preload="auto"></audio>
            <audio id="sfx-startup" src="assets/sfx/startup.mp3" preload="auto"></audio>
            <audio id="sfx-help" src="assets/sfx/help.mp3" preload="auto"></audio>
            <audio id="sfx-store" src="assets/sfx/store.mp3" preload="auto"></audio>
            <audio id="sfx-share" src="assets/sfx/share.mp3" preload="auto"></audio>
            <audio id="sfx-screenshot" src="assets/sfx/screenshot.mp3" preload="auto"></audio>
            <audio id="sfx-flash" src="assets/sfx/flash.mp3" preload="auto"></audio>
            <audio id="sfx-info" src="assets/sfx/info.mp3" preload="auto"></audio>
        </a-assets>

        <script>
            // Safely inject AR Targets without using document.write
            const currentScene = document.currentScript.parentNode;
            let targetsHTML = '';
            for(let i=0; i<=23; i++) {
                targetsHTML += `<a-entity mindar-image-target="targetIndex: ${i}"><a-plane class="ar-plane" visible="false" width="1" position="0 0.15 0.05" material="shader: flat; side: double; transparent: true"></a-plane></a-entity>`;
            }
            currentScene.insertAdjacentHTML('beforeend', targetsHTML);
        </script>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
    const BASE_DATA = [
        { name: 'wizard', prefix: 'wiz', count: 20, folder: 'wizard' },
        { name: 'witch3', prefix: 'wit3', count: 6, folder: 'witch3' },
        { name: 'witch2', prefix: 'wit2', count: 6, folder: 'witch2' },
        { name: 'witch1', prefix: 'wit1', count: 6, folder: 'witch1' },
        { name: 'tealeaf', prefix: 'tea', count: 20, folder: 'tealeaf' },
        { name: 'tarot', prefix: 'tar', count: 78, folder: 'tarot' },
        { name: 'seer', prefix: 'see', count: 20, folder: 'seer' },
        { name: 'portal', prefix: 'por', count: 20, folder: 'portal' },
        { name: 'nostradamus', prefix: 'nos', count: 20, folder: 'nostradamus' },
        { name: 'mystic', prefix: 'mys', count: 20, folder: 'mystic' },
        { name: 'mermaid', prefix: 'mer', count: 20, folder: 'mermaid' },
        { name: 'fortune', prefix: 'for', count: 20, folder: 'fortune' }
    ];

    const COLLECTION_DATA = {};
    BASE_DATA.forEach((data, index) => { COLLECTION_DATA[index] = data; COLLECTION_DATA[index + 12] = data; });

    const sceneEl = document.querySelector('a-scene');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const scannerUi = document.getElementById('scanner-ui');
    const overlay = document.getElementById('overlay');
    const zoomDisplay = document.getElementById('zoom-display');
    const flashOverlay = document.getElementById('flash-overlay');

    const helpBtn = document.getElementById('help-btn');
    const ctaBtn = document.getElementById('cta-btn');
    const shareBtn = document.getElementById('share-btn');
    const infoBtn = document.getElementById('info-btn');
    const flashBtn = document.getElementById('flash-btn');
    const screenshotBtn = document.getElementById('screenshot-btn');
    const recordBtn = document.getElementById('record-btn');
    const recTimer = document.getElementById('rec-timer');

    const downloadPrompt = document.getElementById('download-prompt');
    const downloadYes = document.getElementById('download-yes');
    const downloadNo = document.getElementById('download-no');

    const sfxStart = document.getElementById('sfx-start');
    const sfxStartup = document.getElementById('sfx-startup');
    const sfxHelp = document.getElementById('sfx-help');
    const sfxStore = document.getElementById('sfx-store');
    const sfxShare = document.getElementById('sfx-share');
    const sfxScreenshot = document.getElementById('sfx-screenshot');
    const sfxFlash = document.getElementById('sfx-flash');
    const sfxInfo = document.getElementById('sfx-info');

    let isStarted = false;
    let msgTimeout;
    const videoPool = {}; 
    let currentScale = 1;
    let initialDist = 0;
    let lastFoundTargetIndex = null;
    let sessionPersistentTargetIndex = null;
    let isFlashOn = false;
    let track = null;
    let cameraVideo = null;

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let startTime;
    let timerInterval;
    let lastRecordedBlob = null; 
    
    let audioContext;
    let audioDest;
    const videoSourceNodes = {}; 

    const triggerHaptic = () => { if (navigator.vibrate) navigator.vibrate(50); };

    const showMessage = (el) => {
        document.querySelectorAll('.msg-box').forEach(m => m.classList.remove('visible'));
        el.classList.add('visible');
        if (el !== downloadPrompt) {
            clearTimeout(msgTimeout);
            msgTimeout = setTimeout(() => el.classList.remove('visible'), 5000);
        }
    };

    const findCameraVideo = () => {
        cameraVideo = Array.from(document.querySelectorAll('video')).find(v => 
            v.style.position === 'absolute' || 
            (v.videoWidth > 0 && v.style.display !== 'none' && !Object.values(videoPool).includes(v))
        );
    };

    const toggleFlash = async () => {
        triggerHaptic(); sfxFlash.currentTime = 0; sfxFlash.play();
        try {
            if (!cameraVideo) findCameraVideo();
            if (!track && cameraVideo) track = cameraVideo.srcObject.getVideoTracks()[0];
            const capabilities = track.getCapabilities();
            if (!capabilities.torch) throw new Error('Torch not supported');
            isFlashOn = !isFlashOn;
            await track.applyConstraints({ advanced: [{ torch: isFlashOn }] });
        } catch (err) { showMessage(document.getElementById('flash-error-message')); }
    };

    const toggleRecording = () => {
        triggerHaptic(); sfxScreenshot.currentTime = 0; sfxScreenshot.play();
        if (!isRecording) startRecording(); else stopRecording();
    };

    const startRecording = async () => {
        recordedChunks = [];
        if (!cameraVideo) findCameraVideo();
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
