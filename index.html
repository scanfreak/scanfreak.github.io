<script>
    const overlay = document.getElementById('overlay');
    
    // --- FIX 1: Create ONE shared video element for all targets (Works on iOS & Android) ---
    const sharedVideo = document.createElement('video');
    sharedVideo.crossOrigin = "anonymous";
    sharedVideo.loop = false;
    sharedVideo.preload = "auto";
    sharedVideo.playsInline = true; // Critical for iPhone to not go fullscreen
    sharedVideo.setAttribute('playsinline', ''); // Double safety for iOS

    // 1. The Configuration Map (Unchanged)
    const collectionMap = {
        0: { name: 'wizard', prefix: 'wiz', count: 20, folder: 'wizard' },
        1: { name: 'witch3', prefix: 'wit3', count: 6, folder: 'witch3' },
        2: { name: 'witch2', prefix: 'wit2', count: 6, folder: 'witch2' },
        3: { name: 'witch1', prefix: 'wit1', count: 6, folder: 'witch1' },
        4: { name: 'tealeaf', prefix: 'tea', count: 20, folder: 'tealeaf' },
        5: { name: 'tarot', prefix: 'tar', count: 78, folder: 'tarot' },
        6: { name: 'seer', prefix: 'see', count: 20, folder: 'seer' },
        7: { name: 'portal', prefix: 'por', count: 20, folder: 'portal' },
        8: { name: 'nostradamus', prefix: 'nos', count: 20, folder: 'nostradamus' },
        9: { name: 'mystic', prefix: 'mys', count: 20, folder: 'mystic' },
        10: { name: 'mermaid', prefix: 'mer', count: 20, folder: 'mermaid' },
        11: { name: 'fortune', prefix: 'for', count: 20, folder: 'fortune' }
    };

    // 2. The Logic
    const setupTarget = (index) => {
        const data = collectionMap[index];
        const target = document.querySelector(`[mindar-image-target="targetIndex: ${index}"]`);
        const plane = target.querySelector('a-plane');

        target.addEventListener('targetFound', () => {
            overlay.classList.add('hidden');

            const rand = Math.floor(Math.random() * data.count) + 1;
            const videoPath = `videos/collection01/${data.folder}/${data.prefix}${rand}.mp4`;

            // Reuse the shared video player
            sharedVideo.src = videoPath;

            sharedVideo.onloadedmetadata = () => {
                const ratio = sharedVideo.videoHeight / sharedVideo.videoWidth;
                plane.setAttribute('height', ratio);
                
                // --- FIX 2: Nudge video UP by changing position Y (middle number) ---
                // 0.15 is roughly "100 pixels" up. Adjust this number if needed.
                plane.setAttribute('position', "0 0.15 0.05"); 
                
                plane.setAttribute('material', {src: sharedVideo, shader: 'flat'});
                sharedVideo.play();
            };
        });

        target.addEventListener('targetLost', () => {
            overlay.classList.remove('hidden');
            // Just pause the shared video. No need to delete it.
            sharedVideo.pause();
            sharedVideo.src = ""; 
        });
    };

    // 3. Start
    window.addEventListener('load', () => {
        for (let i = 0; i <= 11; i++) {
            setupTarget(i);
        }
    });
    </script>
